[project]
name = "stm32n6-deployment-zoo"
version = "0.1.0"
description = "Push arbitrary Hugging Face models through the ST Edge AI toolchain onto an STM32N6570-DK, and record what survives."
requires-python = ">=3.11,<3.14"
dependencies = [
    # Graph handling. Pinned tight: the ST front end is sensitive to opset/IR
    # emitted by the exporter, and quantisation results must be reproducible.
    "onnx>=1.21,<1.22",
    "onnxruntime>=1.25,<1.26",
    "onnxsim>=0.4.36",
    "numpy>=1.24",
    # Model sourcing.
    "huggingface_hub>=0.34",
    "requests>=2.31",
    # Calibration data.
    "soundfile>=0.12",
    "librosa>=0.10",
    "pillow>=10.0",
    # Board link.
    "pyserial>=3.5",
    # Reporting.
    "rich>=13.0",
    "tabulate>=0.9",
]

[project.scripts]
zoo = "zoo.cli:main"

[dependency-groups]
dev = [
    "pytest>=7.0",
    "ruff>=0.6",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["zoo"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
