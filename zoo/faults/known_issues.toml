[[issue]]
id            = "stai-layer-discards-epoch-callback"
failure_class = "INSTRUMENTATION_HOOK_DISCARDED"
stage         = "runtime"
zoo_action    = "document-only"
title         = """
    INFRA, SILENT: a per-epoch callback set with
    LL_ATON_RT_SetNetworkCallback() never fires through the stai API - the
    stai layer overwrites it on every run
    """
symptom       = """
    Instrumenting an NPU hang with the documented epoch callback traces
    nothing: the registered callback is never called and nothing reports an
    error. Seen with ST Edge AI Core 4.0.1's middleware (ll_aton 1.1.3-275)
    inside STM32N6-GettingStarted-Audio.
    """
cause         = """
    `__ll_aton_stai_run()` (ll_aton_stai_internal.c:417-425) re-sets the
    network callback on every run: if `nn_context->callback != NULL` it
    installs `_stai_aton_internal_epoch_block_callback`, otherwise NULL -
    discarding whatever the user registered. `_stai_aton_context.callback` is
    never assigned anywhere in the middleware, and there is no public
    per-network setter (stai_runtime_set_callback() feeds a different,
    runtime-wide hook).
    """
workaround    = """
    Write `_stai_aton_context.callback` (and `callback_cookie`) directly - the
    `stai_network *` handle is that context - and stai installs its own
    forwarder, which calls yours. With LL_ATON_EB_DBG_INFO defined each
    epoch-block item carries epoch_num, the in/out streaming-engine masks and
    estimated cycles; print those, not a software counter (see the amendment
    to sw-dequantizelinear-epoch-hang). Use raw USART writes in the callback:
    it may run in ISR context.
    """
silent        = true
is_infra      = true
detectable_statically = false
