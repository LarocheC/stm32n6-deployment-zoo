    Rewrite the graph to the supported vocabulary before compiling
    (DnsmosLossGraph(mode='device') does exactly that), or accept a hand-written
    C kernel. The allowed set is a data table, so a general lint must carry one
    table PER ST Edge AI version - and must be pruned from observed compiler
    acceptance, since it currently produces false positives (see
    lint-false-positive-vs-compiler).
    """
