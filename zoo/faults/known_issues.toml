[[issue]]
id            = "stride2-depthwise-conv-stalls-npu"
failure_class = "NPU_STALL_STRIDE2_DEPTHWISE"
stage         = "runtime"
zoo_action    = "graph-patch"
title         = """
    A stride-2 depthwise convolution compiles clean (0 SW, 0 hybrid epochs)
    and then stalls the NPU forever on the board
    """
symptom       = """
    Booted from flash, `stai_network_run(..., STAI_MODE_SYNC)` never returns:
    `LL_ATON_RT_RunEpochBlock()` keeps returning `LL_ATON_RT_WFE` at the epoch
    holding the stride-2 depthwise convolution. No fault, and no trapped
    interrupt - all 195 `while (1)` handlers in ST's stm32n6xx_it.c were
    replaced with a reporter and none fired. `LL_ATON_RT_POLLING` instead of
    `LL_ATON_RT_ASYNC` behaves identically. Under gdb in development mode the
    same image looks "pathologically slow" rather than stopped, because debug
    events keep nudging the WFE loop: 45 epochs did not finish in ten minutes.
    Observed on Citrinet-256 `Conv2D_70` (group=256, k=[3], stride 2,
    [1,256,800,1] -> [1,256,400,1]); four structurally identical stride-1
    depthwise convolutions with the same [256,4,3,1] weight geometry complete
    immediately before it. All four option sets tried compile it with 0 SW
    epochs and keep the stride-2 epoch, and `--d-dead` (the compiler's epoch
    deadlock analysis) at level 9 reports nothing.
    """
cause         = """
    An undocumented Neural-ART defect (silicon or compiler - not determined)
    specific to stride-2 DEPTHWISE. The stall follows the operator across
    schedules: `--Omax-ca-pipe 4` (45 epochs) stalls at trace epoch 32 waiting
    on output engine 0x01, `--Omax-ca-pipe 1` (44 epochs) at trace epoch 31 on
    0x10 - so it is neither the epoch index nor a particular streaming engine
    (these are the board's 0-based counter; atonn's epoch_num is two higher,
    GATE4.md Round 18). A stride-2 group=1 k=1 convolution in the same graph
    (`/encoder/encoder.{1,7,14}/res.0.0`) executes correctly. Only `Conv2D_70`
    (k=3) was observed stalling; the full graph's other two sites (k=3 and
    k=7) were folded before the board reached them, so their stall is
    inferred. ST's operator documentation does not cover it.
    """
workaround    = """
    Fold the decimation into the pointwise convolution that follows: the
    depthwise conv gets stride 1 and the group=1, k=1, unpadded conv gets
    stride 2. With dilation 1 the stride-2 output at i is the stride-1 output
    at 2i, and the Q/DQ pair between them commutes with decimation. Bit-exact:
    0 of 3,075,000 output elements differ over 30 random inputs, transcript
    identical on real speech; no node added. Free on the 45-epoch prefix: 45
    epochs, 0 SW, 200 kB cpuRAM2, no PSRAM, 540.126 vs 540.157 kB of weights.
    Reference: model/fold_stride2.py, which discovers sites (every Conv with
    group>1 and a stride other than 1) and aborts with exit 2 when a site does
    not match Conv -> Q -> DQ -> Conv(k=1), because a site it cannot fold is a
    site that will stall the board. It runs on the QDQ graph - it requires the
    Q/DQ pair between the two convolutions - i.e. AFTER quantisation. Do not
    use the Slice form (stride-1 conv + Slice(steps=2)): it runs, but costs 4
    SW epochs and spilled 800 kB of activations to hyperRAM (see
    hyperram-spill-hardfaults-without-use-ext-sram). Lint predicate: any Conv
    with group>1 and a stride>1 in the shape-pinned graph.
    """
patch         = "fold_stride2_into_pointwise"
silent        = false
is_infra      = false
detectable_statically = true
sources       = ["/home/claroche/stm32n6-tts/board/GATE4.md", "/home/claroche/stm32n6-tts/README.md", "/home/claroche/stm32n6-tts/model/README.md", "/home/claroche/stm32n6-tts/model/fold_stride2.py"]

