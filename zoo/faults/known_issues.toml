    recursing through TRANSPARENT ops {Unsqueeze, Reshape, Concat, Slice,
    Squeeze, Transpose, MaxPool, AveragePool, ReduceMax, Pad, Relu, Clip},
    depth-limited to 24. Take that DQ's scale and zero_point NAMES, create an
    int8 initializer of the zeros shape filled with int(zero_point) named
    zeros+'_q', insert DequantizeLinear(zeros_q, scale, zp) immediately before
    the Concat and rebind. Value-preserving by construction: (zp-zp)*scale ==
    0.0 exactly. Caveats: only the FIRST zeros operand and FIRST data operand
    are handled; the DQ walk assumes the whole transparent chain shares the
    sibling's grid.
