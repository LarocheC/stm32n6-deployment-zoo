# Known STM32N6 toolchain failures.
#
# GENERATED from a survey of ~/dnsmos_exported and ~/eco8-neaixt, then verified
# entry by entry against the cited sources. 112 findings were extracted, all
# 112 survived verification, and they merge into the 82 distinct constraints
# below. Edit by hand freely — this is the zoo's institutional memory, not a
# build artifact — but keep every entry's `sources`, because a remedy nobody
# has actually run is a hypothesis.
#
# `error_signature` is matched (case-insensitively, as a substring) against
# tool output by zoo.faults.signatures.classify, so these strings are live
# code, not documentation. Getting one wrong makes a real failure unmatched.
#
# Ordered: lint rules first (a static screen can predict these), then graph
# patches, compile post-conditions, board invariants, infra retries, and
# finally the ones there is nothing to do about but know.

[[issue]]
id            = "dynamic-matmul-software-epoch-fallback"
failure_class = "SILENT_SOFTWARE_EPOCH_FALLBACK"
stage         = "compile"
zoo_action    = "lint-rule"
title         = """
    MatMul maps to the NPU only when the second operand is constant; dynamic x
    dynamic falls back to M55
    """
symptom       = """
    Compilation succeeds and results are correct, but any MatMul whose second
    operand is a runtime tensor (e.g. weights kept as graph inputs so the
    optimizer can update them in RAM without reflashing) is emitted as an M55
    software epoch - 27.7 MMAC each per window for the two head matmuls.
    """
cause         = """
    ST's Neural-ART mapper only accelerates MatMul with a constant right-hand
    operand.
    """
workaround    = """
    Accept the SW cost, bake the operand as an initializer where updates are not
    needed, or hand-write the matmul in C (CMSIS-DSP). Read
    `network_generate_report.txt` for the HW/hybrid/SW epoch split before
    writing runtime code. Lint predicate: MatMul whose input[1] is not an
    initializer.
    """
silent        = true
is_infra      = false
detectable_statically = true
sources       = ["/home/claroche/dnsmos_exported/examples/convfsenet_ondevice/README.md"]

[[issue]]
id            = "fp32-elementwise-tail-sets-activation-peak"
failure_class = "QUANTIZATION_COVERAGE_GAP"
stage         = "quantize"
zoo_action    = "lint-rule"
title         = """
    SILENT: ORT quantizes only Conv/Gemm/MatMul, so the backward's elementwise
    tail keeps the peak tensor in fp32
    """
symptom       = """
    Quantization reports success and the model looks int8, but `Equal -> Cast ->
    Sub -> Mul` are untouched by default and carry conv1's output tensor in fp32
    at 4 B/element. Measured on the shipped artifacts every crop variant peaks
    at 15.64 MB ([1,128,199,161]) - a 4x miss against the 3.91 MB analytic int8
    figure, exactly the fp32:int8 byte ratio. At the full 9.01 s window the
    single live activation is 70.75 MB (128 x 900 x 161 x 4 B), larger than the
    DK's 32 MB PSRAM, so the graph cannot be deployed at all. Nothing warns.
    """
cause         = """
    ORT's op_types_to_quantize / default QDQ op registration covers only
    Conv/Gemm/MatMul, so the backward's relu_mask chain - materialized at
    conv1's full size - stays fp32 while everything around it is int8. This is
    NOT an ORT accounting artifact: those tensors sit outside any Q/DQ region,
    so a QDQ-fusing backend materializes them as float too.
    """
workaround    = """
    Quantize the peak-setting elementwise nodes (crop_study.py --elementwise /
    quantize_elementwise=True) and/or shorten the window - the peak scales
    linearly with frames (9.01 s 17.69 MB, 4 s 7.84 MB, 2 s 3.91 MB, 1 s 1.95
    MB, 0.5 s 0.96 MB analytic int8). The memory win costs -0.057 MOS (paired,
    [-0.095, -0.023]), so it is a trade. For the full-size model a compact
    student (stride-2 first conv, 16 channels) is a REQUIREMENT, not an
    optimization. A lint computes per-tensor fp32 bytes from the ONNX before any
    ST tool runs. CROSS-CHECK: the resulting '1.95 MB fits n6-noextmem' claim
    did NOT survive the real allocator - see
    analytic-activation-peak-is-lower-bound.
    """
patch         = "quantize_elementwise_tail"
silent        = true
is_infra      = false
detectable_statically = true
sources       = ["/home/claroche/dnsmos_exported/examples/convfsenet_ondevice/README.md", "/home/claroche/dnsmos_exported/examples/convfsenet_ondevice/FEASIBILITY.md", "/home/claroche/dnsmos_exported/examples/convfsenet_ondevice/budget.py"]

[[issue]]
id            = "macs-silently-zero-on-qdq-graphs"
failure_class = "MAC_ACCOUNTING_SILENTLY_ZERO"
stage         = "lint"
zoo_action    = "lint-rule"
title         = """
    A naive MAC counter reports zero for QDQ int8 graphs because weights arrive
    through DequantizeLinear
    """
symptom       = """
    MAC/compute accounting on an int8 QDQ artifact silently returns 0 (or a
    large undercount) - every Conv/Gemm/MatMul whose weight arrives through
    DequantizeLinear contributes nothing, and no error is raised. The resulting
    latency extrapolation is meaningless.
    """
cause         = """
    In QDQ format the weight input of a Conv/Gemm/MatMul is the output of a
    DequantizeLinear, so it is not in graph.initializer; a lookup that only
    checks initializers and value_info returns None and the node is skipped.
    """
workaround    = """
    Reimplement macs() exactly (budget.py): infer_shapes; shapes over
    input+output+value_info; inits as tuple(t.dims); producers map;
    tensor_shape(name, hops=4) returns inits[name], else shapes[name], else
    follows the producer if its op_type is in (DequantizeLinear, QuantizeLinear,
    Transpose, Identity, Cast) via input[0], else None. Conv: add prod(out) *
    w[1] * (prod(w[2:]) if len(w)>2 else 1) - w[1] is cin/groups so grouping is
    already accounted. MatMul/Gemm: add prod(out) * a[-1]. Carry the caveats:
    nodes with unresolvable shapes contribute 0 silently, and Gemm transA/transB
    are not consulted.
    """
silent        = true
is_infra      = false
detectable_statically = true
sources       = ["/home/claroche/dnsmos_exported/examples/convfsenet_ondevice/budget.py"]

[[issue]]
id            = "qdq-graph-charged-one-byte-per-element"
failure_class = "MEMORY_ACCOUNTING_WRONG_DTYPE"
stage         = "lint"
zoo_action    = "lint-rule"
title         = """
    Charging 1 byte/element across a QDQ int8 graph understates the activation
    peak fourfold
    """
symptom       = """
    A memory model that assumes 'int8 graph => 1 byte per activation element'
    reports a peak 4x too small and declares an on-chip fit the compiler will
    not honour. The graph is nominally int8 while its largest tensors are fp32.
    """
cause         = """
    A QDQ int8 graph still carries fp32 tensors wherever nodes were excluded
    from quantization (frontend MatMuls, shared-weight MatMuls, the small
    elementwise nodes held out to protect the gradient). Their value_info
    elem_type is FLOAT and a fusing backend materializes them as float too,
    because they sit outside any Q/DQ region.
    """
workaround    = """
    Reimplement peak_activation exactly (budget.py): infer_shapes; build
    inits/producers/consumers; passthrough = (DequantizeLinear, QuantizeLinear,
    Cast, Transpose, Identity); is_weight(name) follows producers up to 4 hops
    (no producer -> name in inits; non-passthrough producer -> False; hop
    exhaustion -> False); candidates are value_info + output ONLY (graph.input
    excluded); dims use dim_value>0 else 1, skipping empty/weight tensors; width
    from {FLOAT:4, FLOAT16:2, DOUBLE:8, INT8/UINT8/BOOL:1, INT16/UINT16:2,
    INT32/UINT32:4, INT64/UINT64:8} default 4; if fused_qdq and FLOAT and
    in_quantized_region(name) then width=1, where in_quantized_region is True
    iff the producer is a DequantizeLinear OR the tensor has >=1 consumer and
    every consumer is a QuantizeLinear; nbytes = prod(dims)*width, keep argmax.
    ALWAYS report both fused_qdq=False (what ORT CPU materializes) and
    fused_qdq=True (what Neural-ART materializes), and never quote the fused
    number as measured on target.
    """
silent        = true
is_infra      = false
detectable_statically = true
sources       = ["/home/claroche/dnsmos_exported/examples/convfsenet_ondevice/budget.py"]

[[issue]]
id            = "quantization-starts-before-magnitude-compression"
failure_class = "QUANTIZATION_BOUNDARY_MISPLACED"
stage         = "quantize"
zoo_action    = "lint-rule"
title         = """
    SILENT: quantizing the magnitude-compression prologue drags the raw |STFT|
    input onto a coarse int8 grid
    """
symptom       = """
    Quantization succeeds and the int8 graph runs, but the raw magnitude input -
    60+ dB of dynamic range - is represented on a 256-level per-tensor grid
    before compression, discarding exactly the low-energy detail compression
    exists to preserve. Nothing in the tool reports it. (The quality consequence
    is documented as a mechanism, not quantified.)
    """
cause         = """
    ORT's QDQ quantizer treats the eps-Add of the (|stft|+eps)**0.3 compression
    as a quantizable op, so it inserts Q/DQ on the raw-magnitude graph input
    path ahead of the first Conv. int8 has to START on the compressed features,
    at the frontend Conv.
    """
workaround    = """
    Walk the PREPROCESSED graph from the first non-state graph input forward,
    collecting every node on the path up to (but not including) the first Conv -
    Add(+eps) -> Pow -> Unsqueeze for a mag_compressed export, just Unsqueeze
    for a plain 'mag' export - and pass those names to quantize_static's
    nodes_to_exclude (convfsenet.quant._compression_prologue_nodes). Lint: a
    QuantizeLinear on the path between a magnitude graph input and the first
    Conv.
    """
silent        = true
is_infra      = false
detectable_statically = true
sources       = ["/home/claroche/eco8-neaixt/convfsenet/quant.py"]

[[issue]]
id            = "software-epoch-op-tier"
failure_class = "SILENT_SOFTWARE_EPOCH_FALLBACK"
stage         = "lint"
zoo_action    = "lint-rule"
title         = """
    SILENT: legal-but-software-epoch ops compile and run correctly while costing
    an NPU teardown per occurrence
    """
symptom       = """
    A graph using ReduceSum, Greater, GreaterOrEqual, Less, LessOrEqual, Log,
    Gather, Tile or Resize compiles cleanly and produces correct results, but
    each such op is mapped to a Cortex-M55 software epoch (or forces a float
    fallback), costing an NPU pipeline teardown, a memory round-trip and cache
    maintenance. Nothing flags it: STM32N6_ALLOWED_OPS accepts these because
    they ARE in ST's mapping table, just slowly - so a regression that
    reintroduces an un-substituted form is invisible at compile time.
    """
cause         = """
    ST maps this op tier to software rather than to the Neural-ART accelerator.
    (The cost breakdown is asserted by the source comment, not measured there.)
    """
workaround    = """
    Hand-substitute with HW-mapped equivalents - documented: ReduceSum ->
    ReduceMean*N, tensor-Div -> Reciprocal*Mul, Greater -> Equal - and lint
    against the stricter DNSMOS_DEVICE_OPS (= STM32N6_ALLOWED_OPS minus
    {ConvTranspose, Div, Greater, GreaterOrEqual, Less, LessOrEqual, ReduceSum,
    Resize, Gather, Tile}) rather than the permissive set, so the substitution
    cannot regress unnoticed. Report software_epoch_ops() as a separate warning
    tier for graphs that legitimately keep them.
    """
patch         = "substitute_software_epoch_ops"
silent        = true
is_infra      = false
detectable_statically = true
sources       = ["/home/claroche/dnsmos_exported/src/dnsmos_trainable/verify.py", "/home/claroche/dnsmos_exported/examples/convfsenet_ondevice/patch_for_stedgeai.py"]

[[issue]]
id            = "spectral-norm-power-iteration-traced-into-graph"
failure_class = "EXPORT_ARTIFACT_BLOAT"
stage         = "fetch"
zoo_action    = "lint-rule"
title         = """
    SILENT: spectral_norm's power iteration is exported into the graph,
    inflating the int8 model 4.7x
    """
symptom       = """
    Export succeeds and the model is numerically usable, but 12 stray `MatMul` +
    6 `Div` of pure normalization arithmetic are traced into the ONNX; the
    compiled int8 model is 940 kB instead of 200 kB. `.eval()` does not suppress
    it and `remove_parametrizations` does not see it.
    """
cause         = """
    `torch.nn.utils.spectral_norm` uses the old hook API, so the power iteration
    is live at export time and gets traced. This is a PyTorch export-time
    property of the model, not a board or host problem (the source finding's
    is_infra=true was wrong).
    """
workaround    = """
    Call the legacy `remove_spectral_norm` before export - it folds the
    normalization once and the 18 stray ops disappear (940 kB -> 200 kB int8;
    torch-vs-ONNX parity 1.8e-07 after folding). Lint: 12-MatMul/6-Div
    normalization pattern is visible in the exported ONNX.
    """
patch         = "fold_spectral_norm_power_iteration"
silent        = true
is_infra      = false
detectable_statically = true
sources       = ["/home/claroche/dnsmos_exported/examples/convfsenet_ondevice/ONBOARD_RESULTS.md"]

[[issue]]
id            = "stale-exclusion-names-after-quant-pre-process"
failure_class = "STALE_NODE_NAMES_IN_EXCLUSION_LIST"
stage         = "quantize"
zoo_action    = "lint-rule"
title         = """
    SILENT: node names read from the un-preprocessed graph exclude nothing,
    because quant_pre_process renames every node
    """
symptom       = """
    quantize_static runs cleanly and emits an int8 graph, but nodes_to_exclude
    has no effect: the frontend / backward-tail nodes that were supposed to stay
    float are quantized anyway. ORT does not warn about exclusion names matching
    no node, so the only symptom is degraded numerics downstream.
    """
cause         = """
    quant_pre_process (ORT's shape-inference + optimizer prepass) rewrites and
    renames graph nodes. Any exclusion list gathered by walking the ORIGINAL
    fp32 graph therefore contains names that no longer exist in the graph handed
    to quantize_static.
    """
workaround    = """
    Always compute exclusion lists from the PREPROCESSED graph.
    export.quantize_qdq computes list_matmul_frontend_nodes /
    list_shared_weight_matmuls against pre_path and takes a `preprocessed=True`
    flag so callers that already ran quant_pre_process pass the preprocessed
    file in; eco8's convfsenet/quant.py states the same rule. Harness guard
    (pure ONNX name resolution, no ST tool needed): assert every name in
    nodes_to_exclude resolves against the preprocessed graph before calling
    quantize_static.
    """
silent        = true
is_infra      = false
detectable_statically = true
sources       = ["/home/claroche/dnsmos_exported/src/dnsmos_trainable/export.py", "/home/claroche/eco8-neaixt/convfsenet/quant.py"]

