id            = "int8-input-independent-constant-output"
failure_class = "SILENT_RUNTIME_OUTPUT_CORRUPTION"
stage         = "runtime"
zoo_action    = "board-invariant"
title         = """
    SILENT: at int8 the same defect widens - every output becomes
    input-independent and the fp32 gradient holds int8 zero-point bytes and NaNs
    """
symptom       = """
    Compile and run both succeed. crop0p25s_int8_d2_rows_dev.onnx (201 epochs:
    35 HW / 41 hybrid / 125 SW, 2.24 MB weights, 6.67 MB activations) returns
    mos SIG/BAK/OVRL = 1.909 (0x3ff465d9) / 1.448 (0x3fb959d2) / 1.143
    (0x3f925cd8) BYTE-IDENTICAL across different clips (host reference
    2.403/2.404/1.619 and 1.392/1.424/1.190) and across FOUR builds (-O3, -O1,
    no --Ocache-opt/--cache-maintenance, --Opreserve-inputs). The float32 grad
    buffer holds 0x808080F2-pattern words (0x80 is this graph's int8 activation
    zero-point, i.e. raw int8 bytes read as float32) plus NaNs 0x7FC00000,
    overflowing at 100-300x the host norm. The two outputs fail DIFFERENTLY:
    scores are deterministically wrong (same bits every run and build), the
    gradient is non-deterministically wrong (non-finite count moved 176 -> 460
    and 491 -> 1304 across runs of identical firmware and identical input). The
    values are plausible MOS numbers, so nothing flags them.
    """
cause         = """
    Same root cause as sw-epoch-large-output-corruption - the source's own
    analysis says quantization widens the blast radius rather than causing it,
    and the ruled-out list is identical. Stable-wrong small outputs plus
    unstable-wrong large output points at a stale or uninitialized buffer being
    consumed rather than an arithmetic error. Not a graph fault: ST's own OE
    export in ORT matches the deployable artifact (mos within 0.03, grad cos
    0.80), the fed input is verifiably correct at the device buffer, and a
    bare-runtime firmware (firmware_loss/, no protobuf, no ai_runner, input
    baked into flash) reproduces the identical bits - exonerating the validation
    stack.
    """
workaround    = """
    None on the toolchain side - vendor defect, bug report filed. ALWAYS run an
    input-independence probe on target: feed two materially different inputs and
    assert the outputs differ; a single-input check cannot see this. Fingerprint
    the corruption by hexdumping the float32 output - 0x80 zero-point bytes or
    0x7FC00000 NaNs inside a float buffer identify this class. Run the same
    input twice on identical firmware and compare non-finite counts to separate
    deterministic (arithmetic/constant) wrongness from stale-buffer wrongness.
    Avoid graphs with a large fp32 elementwise region between int8 blocks; the
    forward-only variant and the PESQ predictor, which have none, run correctly
    on the same board.
    """
