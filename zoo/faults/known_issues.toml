zoo_action    = "document-only"
title         = "The lint rejects ops the compiler accepts (InstanceNormalization)"
symptom       = """
    The repo lint flags `InstanceNormalization` as outside its op vocabulary and
    would block deployment; the ST compiler accepted it and the model ran
    correctly on `n6-noextmem` at 37.6 ms.
    """
cause         = """
    The lint's op list is an approximation of the target vocabulary in BOTH
    directions, not a derived one.
    """
workaround    = """
    Do not let a lint rejection be a final verdict - attempt the compile before
    rewriting a graph around a supposedly unsupported op, and prune the lint
    list from observed compiler acceptance. (This is also why the ConvTranspose
    'outside the device vocabulary' claim should be treated as an assumption
    until a compile attempt is recorded.) Establishing that the compiler ACCEPTS
    an op necessarily requires running the compiler.
    """
