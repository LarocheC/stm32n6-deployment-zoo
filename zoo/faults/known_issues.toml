    """
error_signature = "Loading memories failed ! ST-LINK error (DEV_USB_COMM_ERR) could not connect: Connection timed out"
symptom       = """
    `n6_loader.py` aborts with `Loading memories failed !`, sometimes repeatedly
    for the same graph, then loads first try after a USB cycle; or every
    subsequent load attempt fails with DEV_USB_COMM_ERR. Triggered by killing a
    runner mid-inference, by the powerdown reset the loader issues, and
    sometimes simply by a completed validate run. THE LOAD LOG IS MISLEADING -
    the real cause is only in `n6_loader.log`. It cost a measurement slot
    (convfsenet_head_fwd was never measured) and it hit both a band graph and
    the LiSenNet relu6-deep model, so it is entirely independent of the graph.
    """
cause         = """
    The ST-LINK connection forwarded from Windows through usbipd drops on the
    powerdown reset (or is left in an unusable USB endpoint state by a killed
    runner), so gdb cannot reconnect.
    """
workaround    = """
    Check `n6_loader.log`, not just the load log. Kill any stale
    `ST-LINK_gdbserver` first, then cycle the attachment: `usbipd detach --busid
    <id>` then `usbipd attach --wsl --busid <id>` (the busid can change across
    replug). If the wedge follows a `validate` run, PHYSICALLY re-plug the USB -
    an SWD software reset does NOT clear it. Never kill runners mid-inference.
    Any failure recorded while the probe is wedged must be DISCARDED, never
    attributed to the model.
    """
