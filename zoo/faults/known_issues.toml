    analysis says quantization widens the blast radius rather than causing it,
    and the ruled-out list is identical. Stable-wrong small outputs plus
    unstable-wrong large output points at a stale or uninitialized buffer being
    consumed rather than an arithmetic error. Not a graph fault: ST's own OE
