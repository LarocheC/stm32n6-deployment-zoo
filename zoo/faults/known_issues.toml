[[issue]]
id            = "int8-tie-routing-gradient-nondeterminism"
failure_class = "NONDETERMINISTIC_INT8_GRADIENT"
stage         = "quantize"
zoo_action    = "document-only"
title         = """
    SILENT: the int8 gradient is not a function of its input - 5-50% of
    identical reruns diverge, worst cosine 0.036
    """
symptom       = """
    Rerunning the same quantized graph on the same audio across fresh sessions
    and thread counts, 5-50% of executions diverge; when they do the gradient
    can be nearly unrelated to the previous one (worst observed cosine 0.036,
    norm ratio 27x) while the score stays within 0.07 MOS. The divergence rate
    climbs with machine load. fp32 never does this (last-ULP only, cosine
    1.000). Effect on a downstream metric: re-running an identical int8 arm
    moved its mean by 0.012 (+0.385 -> +0.397). Nothing errors, and the score -
    the value most people check - looks stable while the derivative is
    unrelated.
    """
cause         = """
    Tie routing. int8 collapses many activations onto the same code, so a max
    pool's argmax becomes a large tie set and the backward decides membership
    with an Equal against the pooled value; one ULP of reduction-order
    difference moves elements in and out and redirects gradient mass wholesale.
    Thread scheduling sets reduction order, which is why the rate tracks machine
    load. This is also why int8 gradient cosine plateaus near 0.5 no matter how
    much of the graph is held float. NOT infra: host load only modulates a
    property of the model. Measured on the host under ORT; no on-target rate is
    asserted.
    """
workaround    = """
    Pin --threads 1 for reproducible runs and do not evaluate under concurrent
    load. Use an averaging optimizer (Adam over 30 steps absorbs the occasional
    corrupted step; plain SGD would not). Never validate a device gradient
    against a single host run, and expect on-target gradients to differ from any
    desktop simulation by a comparable margin - so a gradient mismatch on target
    is NOT by itself evidence of a compiler or runtime defect. Not statically
    detectable: only 5-50% of executions diverge, so even a single rerun pair
    can miss it; a static pass can at most flag the risk pattern (int8 QDQ +
    global max pool + Equal-based backward mask routing).
    """
silent        = true
is_infra      = false
detectable_statically = false
sources       = ["/home/claroche/dnsmos_exported/examples/convfsenet_ondevice/FEASIBILITY.md"]

