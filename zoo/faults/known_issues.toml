    originally MIS-DIAGNOSED as a MODEL verdict ('the int8 gater lands
    borderline, so depth collapses after frame 0').
    """
cause         = """
    In reloc + COPY mode the buffer descriptor exposes the compile-time npuRAM
    I/O address (0x34270000) while the NPU actually reads from a different,
    relocated, zero-initialised location. `set_input`/`get_input` are inert for
    these `allocate-inputs` graphs (`is_user_allocated==0`), so host writes land
    at an address nothing reads. Verified: input readback rbsum==fsum at
    0x34270000, yet an isolated frontend emits a constant bias-only vector for
    all inputs.
    """
workaround    = """
    Treat per-net COMPUTE LATENCY as valid (conv sub-graphs are
    data-independent) but treat ANY data-dependent on-device result from this
    path as INVALID. To get real per-frame decisions, drive the decision network
    through the standard (non-reloc) `aiValidation` serial path with
    `ai_runner`, threading the recurrent state on the host. General guard: feed
    two distinct inputs and assert the outputs differ before trusting any
    dynamic measurement.
    """
silent        = true
