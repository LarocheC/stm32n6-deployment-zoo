id            = "validate-random-feeds-on-stateful-graph"
failure_class = "MISLEADING_VALIDATION_METRIC"
stage         = "validate"
zoo_action    = "lint-rule"
title         = """
    SILENT: stedgeai validate feeds random data into recurrent state inputs,
    producing a meaninglessly low cosine
    """
symptom       = """
    The per-frame streaming trunk (9 state tensors as graph I/O) validates at
    X-cross cosine 0.843 - a number that reads as a fidelity failure - while the
    same graph matches at 0.998 under realistic threaded states. No error is
    raised; the metric is simply not measuring what it appears to.
    """
cause         = """
    `validate` synthesises random inputs for every graph input, including FIFO
    state tensors, which places them far outside any calibrated distribution.
    """
workaround    = """
    For stateful graphs, do not accept validate's random-input cosine as a
    fidelity verdict; measure with host-threaded realistic states (per-frame
    state propagation, as in eco8's ConvFSENetCalibrationReader) and quote that
    number. The lint must be phrased as the RISK CONDITION - 'graph declares
    recurrent state tensors as inputs => validate's random-input cosine is not a
    fidelity verdict' - which is statically visible; the 0.843 number itself
    only exists after a validate run.
    """
silent        = true
