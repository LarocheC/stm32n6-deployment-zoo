    Documented only as 'ORT's per-channel int32-bias scale adjustment trips on
    this graph's biases' - the mechanism is not stated in any source and must
    not be asserted. The windowed and streaming deploy graphs of the same model
    quantize per-channel fine.
    """
workaround    = """
    Quantize the whole-utterance graph with per_channel=False
    (lisennet/quant_onnx.py main() takes that branch explicitly); keep
    per_channel=True for the deploy-relevant windowed (feat_window) and
    streaming (feat + state_i_in) graphs. Related observation: at ~37 K
    parameters the int8 file is LARGER than fp32 (0.44 MiB vs 0.27 MiB) because
    Q/DQ nodes, scale/zero-point initializers and int32 biases outweigh the
    weight saving.
    """
