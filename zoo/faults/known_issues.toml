[[issue]]
id            = "usbipd-attach-required-and-busid-changes"
failure_class = "USBIPD_ATTACH_FAILURE"
stage         = "board"
zoo_action    = "infra-retry"
title         = """
    INFRA: the board must be re-attached to WSL with the Windows usbipd binary
    after every replug, and the busid moves
    """
error_signature = "ST-Link enumeration failed"
symptom       = """
    The board is invisible to every tool inside WSL until the attach is re-run;
    `usbipd` is not found from inside WSL; or an attach silently targets the
    wrong device because the bus id moved (1-1 -> 1-2) after a physical replug.
    Related tool-side symptom: \"ST-Link enumeration failed\". Combined with the
    ST-LINK wedge (whose only cure is a replug) this must be redone constantly.
    """
cause         = """
    WSL does not automatically re-attach USB devices after a physical replug;
    only the Windows-side executable exists (`/mnt/c/Program
    Files/usbipd-win/usbipd.exe`) - bare `usbipd`/`usbipd.exe` are not on the
    WSL PATH; and bus ids are assigned per physical port/enumeration and are not
    stable.
    """
workaround    = """
    Always call the full Windows path and re-run `usbipd.exe list` after any
    replug to re-read the busid, then `usbipd.exe attach --wsl --busid <id>`
    from Windows before any stedgeai/ai_runner invocation. On \"ST-Link
    enumeration failed\", do a usbipd detach + attach cycle.
    """
silent        = false
