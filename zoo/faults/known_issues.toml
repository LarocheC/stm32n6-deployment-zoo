failure_class = "BATCH_DIM_NOT_ONE"
stage         = "lint"
zoo_action    = "lint-rule"
title         = """
    Batch dimension != 1 on a batched graph input/output (lint rule: batch 1 on
    batched I/O)
    """
error_signature = "{vi.name}: batch {d0.dim_value} != 1"
symptom       = """
    For every I/O tensor of rank > 1, dims[0] is flagged when it is a concrete
    value other than 0 or 1 (symbolic dim0 is deferred to the non-static-shape
    rule). The device runs batch 1.
    """
cause         = """
    The N6 deployment path is single-sample; batched host artifacts must be
    re-exported per-sample.
    """
workaround    = """
    Export the device artifact with batch 1 (rows layout [1, n_rows, hop]).
    IMPORTANT lint caveat: the `batched_io` parameter names which tensors are
    actually batched, and the default (None) applies the rule to EVERY rank>1
    I/O - right for activation-only graphs, wrong for graphs that take weight
    matrices as runtime inputs, where it produces false positives. Pass
    batched_io={...} listing only the genuinely batched tensors.
    """
silent        = false
is_infra      = false
detectable_statically = true
