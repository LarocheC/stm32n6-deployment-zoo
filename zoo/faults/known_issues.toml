id            = "stlink-firmware-too-old-and-upgraded-over-usbipd"
failure_class = "STALE_STLINK_FIRMWARE"
stage         = "board"
zoo_action    = "document-only"
title         = """
    INFRA: ST-LINK firmware below V3J17M11, and upgrading it over usbipd drops
    the WSL attachment mid-flash
    """
error_signature = "JNI 0x1002"
symptom       = """
    `ST-LINK_gdbserver` refuses to work with an older ST-LINK firmware;
    attempting the firmware upgrade from inside WSL over usbipd fails mid-flash
    because the USB re-enumeration drops the forwarded attachment.
    """
cause         = """
    The probe re-enumerates during its own firmware update; usbip cannot follow
    the re-enumeration, so the transfer is cut. Board/host issue, nothing to do
    with the model.
    """
workaround    = """
    Upgrade ST-LINK firmware natively on the Windows host (STSW-LINK007 /
    CubeProgrammer GUI), never through usbipd; require >= V3J17M11 before using
    ST-LINK_gdbserver.
    """
silent        = false
is_infra      = true
detectable_statically = false
