[[issue]]
id            = "ll-aton-middleware-version-mismatch"
failure_class = "STALE_RUNTIME_MIDDLEWARE"
stage         = "board"
zoo_action    = "board-invariant"
title         = """
    INFRA: the app's bundled ll_aton middleware is version-locked to the exact
    stedgeai build that generated network.c, down to the dev number
    """
error_signature = "Possible mismatch in ll_aton library used"
symptom       = """
    The FIRMWARE BUILD FAILS - it does not warn - on the generated model
    source:
        network.c:57:4: error: #error "Possible mismatch in ll_aton library used"
    Dropping a model generated by a newer ST Edge AI Core into an application
    package that vendors an older runtime cannot work, and matching the
    major/minor is not enough to satisfy it.
    """
cause         = """
    `network.c` guards on all four version components with `!=`, so
    LL_ATON_VERSION_DEV must be equal too. Measured here: the package ships
    atonn-v1.1.3-262-g7cc65410, ST Edge AI Core 4.0.1-20581 generates against
    atonn-v1.1.3-275-g6770925d. Same 1.1.3, different dev, hard error. ST
    versions the application package and the compiler independently and ships
    them mismatched.
    """
workaround    = """
    Move the APPLICATION onto the compiler's runtime, not the other way
    round: copy Inc/Lib/Misc/Npu/Reloc/SystemPerformance from
    `<stedgeai>/Middlewares/ST/AI` over the package's `Middlewares/ST/AI`,
    and follow the runtime-library rename in the Makefile
    (NetworkRuntime1200_CM55_GCC.a -> NetworkRuntime1201_CM55_GCC.a).
    Downgrading the compiler instead invalidates every compile-stage number
    already recorded against the model. Two knock-on effects, both hit here:
    the newer headers stop pulling in `assert.h` transitively, and GCC 14
    makes an implicit function declaration an error, so
    `Projects/Common/cpu_stats.c` needs an explicit `#include <assert.h>`.
    Check the version pair BEFORE generating - one grep of
    `Middlewares/ST/AI/Npu/ll_aton/ll_aton_version.h` against the toolchain's
    copy - because the alternative is discovering it after a compile.
    Verified on silicon (Gate 4 Round 4): ST's AED model regenerated with ST
    Edge AI Core 4.0.1 runs from flash in ST's otherwise unmodified application
    on the moved 1.1.3-275 middleware, so the upgrade itself is not a boot or
    runtime risk.
    """
silent        = false
is_infra      = true
detectable_statically = false
sources       = ["/home/claroche/eco8-neaixt/deploy/stm32n6/README.md", "/home/claroche/stm32n6-tts/firmware/apply_vendor_mods.sh", "/home/claroche/stm32n6-tts/artifacts/model_c/network.c", "/home/claroche/stm32n6-tts/board/GATE4.md"]

