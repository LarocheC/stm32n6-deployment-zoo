[[issue]]
id            = "op-outside-supported-vocabulary"
failure_class = "OP_OUTSIDE_SUPPORTED_VOCABULARY"
stage         = "lint"
zoo_action    = "lint-rule"
title         = """
    Op absent from the ST Neural-ART operator-mapping table (lint rule: op
    vocabulary)
    """
error_signature = "ops outside STM32N6 vocabulary: {sorted(extra)}"
symptom       = """
    check_device_constraints calls check_op_vocabulary and reports the sorted
    set of op_types in the graph that are not in the allowed set (default
    STM32N6_ALLOWED_OPS, or a stricter per-project set). Named examples outside
    the table: Where, Expand, Scatter*, TopK, LayerNormalization.
    """
cause         = """
    STM32N6_ALLOWED_OPS enumerates ops present in ST's operator-mapping table
    with an HW, hybrid, or documented SW_INT/SW_FLOAT Cortex-M55 fallback.
    Anything absent has no mapping - it is either un-importable by ST Edge AI
    Core or of undocumented behaviour on the N6.
    """
workaround    = """
    Rewrite the graph to the supported vocabulary before compiling
    (DnsmosLossGraph(mode='device') does exactly that), or accept a hand-written
    C kernel. The allowed set is a data table, so a general lint must carry one
    table PER ST Edge AI version - and must be pruned from observed compiler
    acceptance, since it currently produces false positives (see
    lint-false-positive-vs-compiler).
    """
silent        = false
is_infra      = false
detectable_statically = true
sources       = ["/home/claroche/dnsmos_exported/src/dnsmos_trainable/verify.py"]

[[issue]]
id            = "opset-above-cap"
failure_class = "OPSET_TOO_HIGH"
stage         = "lint"
zoo_action    = "lint-rule"
title         = "Opset above the accepted cap (lint rule: opset <= max_opset)"
error_signature = "opset {opset} > {max_opset}"
symptom       = """
    check_device_constraints reports a violation when the default ('')
    opset_import version exceeds max_opset. ST's hard cap is 20; this repo pins
    DNSMOS device exports to ST's recommended 13 and the eco8-neaixt convention
    is 17, so anything above the pinned value is a device-artifact defect
    flagged before any ST tool runs.
    """
cause         = """
    ST Edge AI Core 4.0.1 supports up to opset 20 and behaves best at its
    recommended level; higher-opset exports (and the op forms they introduce,
    e.g. the dynamo/opset-20 shape subgraphs) are outside the validated
    envelope.
    """
workaround    = """
    Re-export at the pinned opset (rows-layout torchscript at opset 13 here) or
    run the ONNX version converter down to it; pass max_opset explicitly per
    project convention.
    """
patch         = "downgrade_opset"
silent        = false
is_infra      = false
detectable_statically = true
sources       = ["/home/claroche/dnsmos_exported/src/dnsmos_trainable/verify.py"]

[[issue]]
id            = "ort-qlinearmatmul-rejects-per-channel-zero-point"
failure_class = "HOST_KERNEL_LIMITATION"
stage         = "validate"
zoo_action    = "lint-rule"
title         = """
    INFRA: ORT CPU fuses DQ+DQ+MatMul into QLinearMatMul at session load and
    rejects the per-channel weight zero-point
    """
symptom       = """
    Once both of a MatMul's inputs are quantized, the host reference session
    fails at load time (or the MatMul cannot be placed), even though the
    exported graph is valid ONNX and compiles for the target. The verbatim ORT
    message is not recorded in the source. Easy to misattribute to the exporter
    or to the ST toolchain.
    """
cause         = """
    An ORT CPU kernel limitation on QLinearMatMul with per-channel weight
    zero-points, triggered by session-load fusion. The source is explicit: 'an
    ORT CPU kernel limit, not a defect in the exported graph' - a HOST-runtime
    limitation that does not affect the target compile, which is why it is
    classified infra here even though the remedy lives in the export.
    """
workaround    = """
    Use per-node exclusion (nodes_to_exclude) so a MatMul never has both inputs
    quantized simultaneously - this is why the shipped artifacts carry per-node
    exclusion lists rather than a per-op-type policy. Do NOT record this as a
    model or ST-toolchain verdict. Lint predicate: a MatMul whose two inputs are
    both DequantizeLinear outputs and whose weight-side zero_point initializer
    has rank > 0.
    """
silent        = false
is_infra      = true
detectable_statically = true
sources       = ["/home/claroche/dnsmos_exported/examples/convfsenet_ondevice/FEASIBILITY.md"]

