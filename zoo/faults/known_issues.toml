    extra_options={'ActivationSymmetric': False, 'WeightSymmetric': True} (the
    --signed path in lisennet/quant_onnx.py, matching convfsenet/quant.py).
    per_channel=True is used on the windowed and streaming deploy branches but
    NOT on the plain --signed path. Lint before compiling: read the elem_type of
    the zero_point initializer on activation QuantizeLinear nodes and reject
    UINT8.
    """
silent        = false
is_infra      = false
detectable_statically = true
