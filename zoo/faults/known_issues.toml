[[issue]]
id            = "power-meter-inline-on-cn6-kills-stlink"
failure_class = "POWER_RIG_BREAKS_DEBUG_LINK"
stage         = "board"
zoo_action    = "document-only"
title         = "INFRA: inserting the USB power meter inline on CN6 kills ST-LINK enumeration"
error_signature = "descriptor request failed"
symptom       = """
    With the FNB58 meter inline on CN6, Windows reports \"descriptor request
    failed\" and the board is powered but nothing can talk to it (meter reads D+
    3.09 V / D- 0.06 V, a full-speed idle pull-up with no host traffic).
    """
cause         = """
    CN6 (USB-C, STLINK-V3EC) carries BOTH the board's 5 V and the debug link,
    and the meter consumes the data lines for its own PC link, so the debug
    enumeration is destroyed by the instrumentation itself.
    """
workaround    = """
    Move JP2 to [3-4] = 5V_USB_SNK, feed board 5 V through the meter into CN8
    (USB1), and connect the debugger straight to CN6. This also excludes the
    STLINK-V3EC circuitry from the measured rail. Restore JP2 to [1-2] = STLK
    afterwards.
    """
silent        = false
is_infra      = true
detectable_statically = false
