symptom       = """
    Building STM32N6-GettingStarted-Audio with the toolchain the zoo pins -
    arm-gnu-toolchain-13.3.rel1, the version ST document as validated for
    Cortex-M55 - fails immediately:
        arm-none-eabi-gcc: error: unrecognized command-line option '-fcyclomatic-complexity'
    The error names a flag, which sends the reader looking for where the flag
    came from rather than for which compiler is missing.
