id            = "cpuram2-pool-overlaps-fsbl-region"
failure_class = "MEMORY_POOL_OVERLAPS_BOOTLOADER"
stage         = "compile"
zoo_action    = "document-only"
title         = """
    INFRA, SILENT: ST's stm32n6.mpool gives cpuRAM2 1024 KB from 0x34100000,
    straight through the FSBL's 0x34180000-0x34200000; ST's layout guarantees
    only 512 KB
    """
symptom       = """
    Nothing. ST's Doc/Boot-Overview.md reserves "1MB of SRAM2" for network
    activations and the shipped stm32n6.mpool declares cpuRAM2 = 1024 KB at
    0x34100000, i.e. up to 0x34200000 - while ST's own FSBL linker script
    (STM32N657XX_AXISRAM2_fsbl.ld) places the FSBL image at 0x34180400 and its
    RAM at 0x341C0000-0x34200000, and the boot diagram draws the user app as
    0x34000000-0x34180000. The compiler will allocate activations into the top
    512 KB without comment. It never fires for ST's models: their AED model
    uses cpuRAM2: 0 B.
    """
cause         = """
    The documentation and the mpool agree with each other and disagree with
    the FSBL's own layout by 512 KB (GATE4.md Round 7). Whether an overlap
    matters at runtime is NOT established. The FSBL has copied the image,
    set VTOR/MSP and jumped before the app's first inference, so the region is
    plausibly dead by then. Consistent with that (inference, not a conclusion
    the source draws): the --force-all-in-out-to-mem Citrinet build used
    800 kB of cpuRAM2 (78.1 %) - if allocated from the pool base, as the
    truncated graph's 0x34100000-0x34132000 was, it reaches ~0x341C8000 - and
    ran from flash repeatably with output identical to the 448-epoch build.
    Also note Round 7's claim that the 8 s model's "625 KB of activations"
    crosses the line conflates the total with cpuRAM2: under --Oauto-sched
    that build is 200 kB cpuRAM2 + 425 kB npuRAM6.
    """
workaround    = """
    If you want to stay inside what ST's boot layout guarantees, check that the
    cpuRAM2 range in network_generate_report.txt ends at or below 0x34180000 -
    as a warning, not a failure, until an overlap is shown to break something,
    since a working build exceeded it. --Oauto-sched cut cpuRAM2 on Citrinet
    from 500 kB to 200 kB. AXISRAM3/4/5 are clocked by the audio app but
    undeclared in the mpool; declaring them would widen the pools from
    1,507,328 B to ~2,884,608 B (arithmetic, not compiled). Report the
    doc/mpool mismatch upstream.
    """
silent        = true
is_infra      = true
detectable_statically = false
