[[issue]]
id            = "stlink-firmware-too-old-and-upgraded-over-usbipd"
failure_class = "STALE_STLINK_FIRMWARE"
stage         = "board"
zoo_action    = "document-only"
title         = """
    INFRA: ST-LINK firmware below V3J17M11, and upgrading it over usbipd drops
    the WSL attachment mid-flash
    """
error_signature = "JNI 0x1002"
symptom       = """
    `ST-LINK_gdbserver` refuses to work with an older ST-LINK firmware;
    attempting the firmware upgrade from inside WSL over usbipd fails mid-flash
    because the USB re-enumeration drops the forwarded attachment.
    """
cause         = """
    The probe re-enumerates during its own firmware update; usbip cannot follow
    the re-enumeration, so the transfer is cut. Board/host issue, nothing to do
    with the model.
    """
workaround    = """
    Upgrade ST-LINK firmware natively on the Windows host (STSW-LINK007 /
    CubeProgrammer GUI), never through usbipd; require >= V3J17M11 before using
    ST-LINK_gdbserver.
    """
silent        = false
is_infra      = true
detectable_statically = false
sources       = ["/home/claroche/eco8-neaixt/deploy/stm32n6/ONBOARD_MEASUREMENT.md"]

[[issue]]
id            = "validate-refuses-unfused-gemm-graph"
failure_class = "FRONTEND_INTERNAL_ERROR"
stage         = "validate"
zoo_action    = "document-only"
title         = """
    stedgeai validate re-runs ORT optimization, re-introduces the Gemm fusion
    the export avoided, and crashes
    """
error_signature = "INTERNAL ERROR: Overwriting Entry 0 of _Mul_5_output_0"
symptom       = """
    A model that generates and runs on the board cannot be validated: `stedgeai
    validate --mode target` crashes on the reference model. The workaround for
    the activation-C Gemm blocker is therefore not measurable through validate
    at all.
    """
cause         = """
    The validate path runs ORT optimization on the reference ONNX internally,
    re-creating the MatMulAddFusion / activation-C Gemm that
    `skip_optimization=True` was used to prevent.
    """
workaround    = """
    Do not use `validate` for un-fused models: load with n6_loader.py and
    measure with `npu_profiler.py` against the already-loaded firmware, then
    verify accuracy off-board (host ORT int8-vs-FP32 cosine) instead of via
    validate's on-target cross-check. Predicting the crash means running ORT's
    optimizer on the reference ONNX and looking for a re-created activation-C
    Gemm - offline and ST-free, but not a pure schema lint.
    """
silent        = false
is_infra      = false
detectable_statically = true
sources       = ["/home/claroche/eco8-neaixt/deploy/stm32n6/NSNET2_DEPLOYMENT_NOTES.md", "/home/claroche/eco8-neaixt/deploy/stm32n6/ONBOARD_MEASUREMENT.md"]

[[issue]]
id            = "wsl2-nat-blocks-usbip-tcp-3240"
failure_class = "HOST_NETWORK_BLOCKS_USBIP"
stage         = "board"
zoo_action    = "document-only"
title         = """
    INFRA: WSL2 NAT networking is blocked by the Windows firewall on the usbip
    TCP-3240 link
    """
symptom       = """
    The ST-LINK cannot be attached into WSL at all: the usbip link hits a
    Windows-firewall TCP-3240 block when WSL2 is in the default NAT networking
    mode.
    """
cause         = """
    usbip runs over TCP port 3240; in NAT mode the Windows firewall blocks that
    connection between the WSL VM and the Windows usbipd service.
    """
workaround    = """
    Set WSL2 networking to mirrored in %UserProfile%\\.wslconfig ([wsl2]
    networking=mirrored) and run `wsl --shutdown` to apply.
    """
silent        = false
is_infra      = true
detectable_statically = false
sources       = ["/home/claroche/eco8-neaixt/deploy/stm32n6/ONBOARD_MEASUREMENT.md"]
