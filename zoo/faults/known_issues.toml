id            = "busy-loop-idle-baseline-inflates-energy"
failure_class = "SILENT_INVALID_POWER_BASELINE"
stage         = "runtime"
zoo_action    = "document-only"
title         = """
    INFRA, SILENT: the firmware's 'idle' power baseline is a busy loop, so every
    published energy delta uses the wrong reference
    """
symptom       = """
    No error; the power capture completes and yields clean, quotable mW /
    uJ-per-inference figures. But the baseline phase is not idle, so the deltas
    are wrong - the giveaway is that `matched - idle` comes out NEGATIVE (-13.6
    / -11.2 mW). Numbers derived this way were quoted externally before the flaw
    was found.
    """
cause         = """
    The 'idle' phase is `pwr_spin()`, a `while (HAL_GetTick()-t0 < ms)` busy
    loop, and the UTIA matched-duration wait polls `DWT->CYCCNT`. Neither parks
    the core; they differ by 11-14 mW purely in what the M55 polls. Real
    inference meanwhile parks the M55 in WFE, so the active and baseline phases
    differ in MCU behaviour as well as in NPU work.
    """
workaround    = """
    Quote absolute energy on the UTIA matched-wait basis (it at least holds the
    loop structure fixed) and describe the 0.9144 W figure as 'loaded baseline,
    MCU spinning', not 'idle'. A true idle requires a WFI/WFE phase in the
    firmware. Within-firmware ratios (nb 4 vs nb 8) remain valid because both
    use identical baselines.
    """
silent        = true
