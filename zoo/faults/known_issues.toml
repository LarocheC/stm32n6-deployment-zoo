[[issue]]
id            = "dcache-not-maintained-around-npu-run"
failure_class = "CACHE_COHERENCY_CORRUPTION"
stage         = "runtime"
zoo_action    = "board-invariant"
title         = """
    INFRA: missing D-cache maintenance around an NPU run is the top cause of
    garbage NPU output
    """
symptom       = """
    The network runs without any error but produces garbage outputs, because the
    NPU reads stale input data or the CPU reads stale output data from cacheable
    AXISRAM.
    """
cause         = """
    NPU input/output buffers (and reloc activations) live in cacheable AXISRAM;
    the M55 D-cache must be cleaned after writing inputs and invalidated before
    reading outputs.
    """
workaround    = """
    Use the package's `mcu_cache_*` helpers: clean D-cache after writing NPU
    inputs, invalidate before reading outputs, on EVERY inference. Note this was
    explicitly ruled out as the cause of the large-SW-epoch-output corruption,
    so eliminating it does not explain that defect. In
    STM32N6-GettingStarted-Audio the only clean is inside the PRE-PROCESSOR,
    not the AI wrapper (Projects/Dpu/preproc_dpu.c:144 cleans the spectrogram
    before AiDPUProcess()), and nothing invalidates the output anywhere,
    because the stock AED output is float32 read from a coherent buffer.
    Replacing ST's pre-processing with your own front end - which any non-AED
    audio model needs - silently drops the input clean: add
    mcu_cache_clean_invalidate_range() on the input after writing it and
    mcu_cache_invalidate_range() on the output after stai_network_run().
    (stm32n6-stt added both; its output was not observed stale without the
    invalidate, so that half is insurance rather than a measured fix.)
    """
silent        = false
is_infra      = true
detectable_statically = false
sources       = ["/home/claroche/eco8-neaixt/deploy/stm32n6/README.md", "/home/claroche/eco8-neaixt/deploy/stm32n6/firmware_optionC/README.md", "/home/claroche/stm32n6-tts/firmware/WORKLIST.md", "/home/claroche/stm32n6-tts/firmware/vendor-mods/gate4.patch"]

[[issue]]
id            = "hyperram-spill-hardfaults-without-use-ext-sram"
failure_class = "UNMAPPED_EXTERNAL_RAM_SPILL"
stage         = "runtime"
zoo_action    = "board-invariant"
title         = """
    INFRA: a compile that places activations in hyperRAM HardFaults in ST's
    audio app - 0x90000000 is never mapped unless USE_EXT_SRAM is defined
    """
symptom       = """
    The network runs the epochs before the spill and then the part dies: the
    first write to 0x90000000 raises an imprecise bus error that escalates to
    HardFault (CFSR = 0x00000400, BFSR.IMPRECISERR, HFSR.FORCED). Because ST's
    fault handlers are `while (1)` traps, that is a silent hang unless a fault
    reporter is installed. Hit with a graph rewrite (stride-1 conv + Slice)
    that made the compiler spill 800 kB of activations to hyperRAM.
    """
cause         = """
    `Ext_Mem_Config()` gates `BSP_XSPI_RAM_Init()` behind USE_EXT_SRAM, which
    STM32N6-GettingStarted-Audio does not define, while ST's audio mpool
    offers the compiler hyperRAM at 0x90000000 / 16 MB. Nothing ties the
    compile's placement to the firmware's memory initialisation.
    """
workaround    = """
    Treat any non-zero hyperRAM line in network_generate_report.txt as a
    firmware requirement: either build with -DUSE_EXT_SRAM (initialises the
    board's APS256 PSRAM and memory-maps 0x90000000; with it the same image ran
    to completion repeatedly) or, better, remove the spill from the graph (see
    psram-spill-with-zero-sw-epochs - a spill is also slow). Leave the define
    off otherwise: the fold that replaced the Slice needs neither PSRAM nor
    the define.
    """
silent        = false
is_infra      = true
detectable_statically = false
sources       = ["/home/claroche/stm32n6-tts/board/GATE4.md", "/home/claroche/stm32n6-tts/board/BUILD.md"]

[[issue]]
id            = "lcd-graft-onto-audio-app-layer0-and-pll4"
failure_class = "LCD_GRAFT_INTEGRATION"
stage         = "board"
zoo_action    = "board-invariant"
title         = """
    INFRA: grafting the DK's LCD onto the audio app - layer 0's stock address
    is inside the app, the LTDC/DMA2D HAL modules are off, and PLL4 is shared
    with the microphone
    """
symptom       = """
    Three traps when adding the 800x480 panel (the nine LCD files of ST's
    ObjectDetection package) to STM32N6-GettingStarted-Audio. (1) Without
    HAL_LTDC_MODULE_ENABLED / HAL_DMA2D_MODULE_ENABLED the build fails at LINK
    time with undefined HAL_LTDC_* symbols, not at compile time.
    (2) BSP_LCD_InitEx() programs layer 0 before the application can call
    BSP_LCD_ConfigLayer(); the stock LCD_LAYER_0_ADDRESS 0x34000000 is 1 KiB
    below the app's ORIGIN and LCD_LAYER_1_ADDRESS is inside its .text, so the
    LTDC would DMA-scan the application's code as pixels. (3) The pixel clock
    depends on init order. (2) and (3) were found by reading the source and
    avoided, not observed failing.
    """
cause         = """
    ST's audio package ships the LTDC/DMA2D HAL modules commented out and an
    `stm32n6570_discovery_conf.h` whose LCD addresses assume another memory
    layout. `MX_MDF1_ClockConfig()` reprograms PLL4 for the microphone
    (1376/28 = 49.142 MHz at 16 kHz) and `MX_LTDC_ClockConfig()` takes the
    pixel clock as IC16 = PLL4/2 = 24.57 MHz from whatever it finds - within
    2 % of the panel's nominal 25 MHz, which stm32n6-stt calls a coincidence,
    not a design.
    """
workaround    = """
    Enable both HAL modules in stm32n6xx_hal_conf.h; set LCD_LAYER_0_ADDRESS to
    0x34200000; call Record_Init() BEFORE BSP_LCD_Init() and print
    HAL_RCCEx_GetPeriphCLKFreq(RCC_PERIPHCLK_LTDC) at init (measured
    24,571,428 Hz). No PSRAM is needed: AXISRAM3/4/5 (0x34200000 + 3 x
    0x70000, up to npuRAM6 at 0x34350000) are clocked by Int_Mem_Config() but
    claimed by neither the linker script nor stm32n6.mpool, and held the
    768,000 B framebuffer plus two 256,000 B audio buffers with 92,160 B spare.
    Mirror ObjectDetection's directory layout for the LCD files so their
    relative #includes need no edits.
    """
silent        = false
is_infra      = true
detectable_statically = false
sources       = ["/home/claroche/stm32n6-tts/board/BUILD.md", "/home/claroche/stm32n6-tts/firmware/FRONTEND.md", "/home/claroche/stm32n6-tts/firmware/WORKLIST.md"]

[[issue]]
id            = "linker-region-past-0x34200000-stack-in-npuram"
failure_class = "LINKER_REGION_STACK_IN_INACCESSIBLE_RAM"
stage         = "board"
zoo_action    = "board-invariant"
title         = """
    INFRA: growing AXISRAM1_S past 0x34200000 puts the M55 stack in npuRAM6 and
    the firmware dies before UART
    """
