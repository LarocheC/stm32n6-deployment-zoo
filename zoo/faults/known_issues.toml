[[issue]]
id            = "hotplug-fails-after-first-boot-from-flash"
failure_class = "SWD_CONNECT_MODE_LATCHED_AT_RESET"
stage         = "board"
zoo_action    = "infra-retry"
title         = """
    INFRA: `mode=HOTPLUG` stops working once a board has been booted from
    flash, in BOTH switch positions; `mode=UR` still works
    """
# Deliberately NO error_signature. This failure prints `Unable to get core ID`
# and `No STM32 target found`, and the second of those is already the signature
# of `no-stm32-target-found-on-swd`, whose remedy (press RESET) is a different
# one. Two entries matching the same text would make which remedy you get an
# accident of string length. The amendment at the end of this file puts the
# mode=UR remedy on the existing entry instead, where the match already lands.
symptom       = """
    `STM32_Programmer_CLI -c port=SWD mode=HOTPLUG` fails with
    `Unable to get core ID` / `No STM32 target found` even after the boot
    switches are returned to the development position - on a board where
    HOTPLUG worked before it was ever booted from flash. It looks exactly like
    the wedged-probe entry, whose remedy is a physical replug, and reaching for
    that first wastes the trip.
    """
cause         = """
    The boot configuration is latched at reset, so moving a switch under power
    changes nothing until the next reset. HOTPLUG attaches to a running target
    and never asserts NRST, so it never gets one. `mode=UR` (connect under
    reset) asserts NRST and catches the part early, which is why it works in
    both positions.
    """
workaround    = """
    Use `mode=UR` rather than `mode=HOTPLUG` (the zoo's loader path assumes
    HOTPLUG). Measured access matrix on this board, both positions:
        operation                    dev      flash-boot
        mode=HOTPLUG connect         fails    fails
        mode=UR connect              works    works
        read external flash          works    works
        erase / write ext. flash     works    fails
        ST-LINK_gdbserver halt       fails    fails
    So erasing needs the development position and reading does not. Separately,
    `ST-LINK_gdbserver` cannot halt this part at all with `--halt`/`-k`; ST's
    documented invocation is `-m 1 -g` - access port 1, attach to a RUNNING
    target - and even that only gets further in the development position.
    ST's own `make flash_bm` (bm.mk:35) and sign-and-flash-model.sh both use
    mode=HOTPLUG, so neither works on a board that has been flash-booted. And
    STM32_Programmer_CLI cannot attach over SWD while the application runs, so
    a running application's RAM is unreachable from the host: stm32n6-stt had
    to base64 a 256,000 B capture buffer out over the UART from the firmware.
    """
silent        = false
is_infra      = true
detectable_statically = false
sources       = ["/home/claroche/stm32n6-tts/board/GATE3.md", "/home/claroche/stm32n6-tts/board/BUILD.md", "/home/claroche/stm32n6-tts/firmware/FRONTEND.md"]

