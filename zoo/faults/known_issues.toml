[[issue]]
id            = "flash-boot-output-lost-in-usbipd-reattach-gap"
failure_class = "BOOT_OUTPUT_LOST_IN_REENUMERATION"
stage         = "board"
zoo_action    = "board-invariant"
title         = """
    INFRA, SILENT: a flash boot is a power cycle, the VCP re-enumerates, and
    everything printed in the first ~8 s is lost - an early hang reads as a
    dead board
    """
symptom       = """
    "0 bytes" on the UART after every flash boot of a model image, read for
    six rounds as "the image dies before main" - while the board was in fact
    printing about five lines within two seconds of boot and then hanging in
    the NPU invoke. A working control (ST's AED model) looked different only
    because its inference returns, so its loop prints forever and is
    eventually seen. Measured: the serial port lost at 98.5 s and reopened at
    106.3 s, a 7.8 s re-enumeration gap under usbipd. A RAM-pressure test, a
    known-good control, an app-size and weight-base bisection, an FSBL
    disassembly and a read of ST's boot documentation (GATE4.md Rounds 3-7)
    were all spent on an artefact of the listening window.
    """
cause         = """
    Booting the DK from flash needs a power cycle, not the reset button
    (board/BUILD.md:315, :372-373), and the ST-LINK USB carries both the
    board's power and the VCP, so every flash boot re-enumerates the serial
    port; under WSL/usbipd the re-attach took ~8 s. One-shot output emitted at
    power-on lands in a window in which nothing is listening. How long the gap
    is on a native Linux host was not measured.
    """
workaround    = """
    Make early output outlast the gap and never reason from absence.
    stm32n6-stt holds one HAL_Delay(12000) after UART_Config(), loops the
    result print, and (behind a define) writes one raw character straight into
    USART1->TDR after each init step, so the last character received names the
    last step completed. An earlier version held every marker for 2 s, which
    put ~32 s in front of the invoke and was later misread as NPU slowness -
    keep such holds out of anything timed. Read the flash back before blaming
    the image.
    """
silent        = true
is_infra      = true
detectable_statically = false
