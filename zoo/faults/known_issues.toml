[[issue]]
id            = "bool-quant-json-discards-all-quantization"
failure_class = "QUANTIZATION_SILENTLY_DISCARDED"
stage         = "compile"
zoo_action    = "compile-postcondition"
title         = """
    SILENT: one BOOL tensor in the generated *_Q.json makes atonn discard the
    entire quantization and build an fp32 network
    """
error_signature = "INVALID_ARGUMENT:(tensors[N].value.format.type): invalid value \"BOOL\" for type ...GraphInfo.ContainerType Ignore Quantization JSON file; unsupported version ''"
symptom       = """
    `stedgeai generate` SUCCEEDS and produces a working-looking network, but ALL
    quantization has been thrown away and every float tensor is treated as
    native float - wrong size, wrong latency, wrong memory footprint versus what
    was asked for. atonn emits two NON-FATAL lines and continues, so a caller
    checking exit status sees success and the failure surfaces only as
    unexplained size/latency/accuracy figures downstream. The most dangerous
    quantization outcome in this catalogue.
    """
cause         = """
    For graphs containing `Equal`/`Cast` (e.g. max-pool gradient masks in a
    fused fwd+bwd loss graph) the `*_Q.json` emitted by ST's OWN front end
    contains entries with \"type\": \"BOOL\". BOOL is not a valid
    GraphInfo.ContainerType for atonn's protobuf parser, which rejects the whole
    file on the first unrecognised entry instead of skipping it, downgrades the
    parse failure to an 'unsupported version' warning, and falls back to 'no
    quantization info'.
    """
workaround    = """
    Strip BOOL entries from `*_Q.json` between the front end and atonn. The
    projects shimmed the binary: move `atonn` -> `atonn.real` and drop
    `atonn_shim.sh` in its place; the shim scans argv for `--json-quant-file`,
    deletes every key in d['tensors'] whose ['format']['type'] == 'BOOL',
    rewrites the file in place with indent=1 only if at least one BOOL was
    found, then exec's atonn.real with the ORIGINAL argv. WORKFLOW TRAPS: (a)
    the shim MUTATES the front end's output file in place; (b) it has since been
    REMOVED, so any later `generate`/`validate` on the loss graph silently
    regresses to an unquantized build unless re-installed. Independently verify
    quantization survived by checking the generated network's weight size and
    epoch mix against expectation rather than trusting a successful build.
    Static detection is only a PRECURSOR heuristic (Equal/Cast producing BOOL in
    a graph you intend to quantize) - the *_Q.json exists only after stedgeai
    runs.
    """
patch         = "strip_bool_from_quant_json"
silent        = true
is_infra      = false
detectable_statically = false
sources       = ["/home/claroche/dnsmos_exported/examples/convfsenet_ondevice/ONBOARD_RESULTS.md", "/home/claroche/dnsmos_exported/examples/convfsenet_ondevice/ST_BUG_REPORT.md", "/home/claroche/dnsmos_exported/examples/convfsenet_ondevice/atonn_shim.sh"]

