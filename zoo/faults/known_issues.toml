[[issue]]
id            = "dk-microphone-hot-at-stock-mdf-gain-clips"
failure_class = "SILENT_INPUT_CLIPPING"
stage         = "runtime"
zoo_action    = "document-only"
title         = """
    SILENT: the DK's MP23DB01HP at the stock MDF gain peaks near -4 dBFS and a
    louder talker clips - 62.5 % WER from a clean NPU run
    """
symptom       = """
    At the BSP default MDF_GAIN(16000) = 2 one utterance measured -3.8 dBFS
    peak, -23.5 dBFS RMS, 0 clipped samples. A louder or closer talker at the
    same gain clipped 1067 of 128,000 samples (0.83 %) and scored 62.5 % WER,
    the worst figure in the project; reproduced deliberately later (907
    clipped, transcript garbled). 39 clipped samples (0.03 %) scored 0.0 %.
    Every log reports a clean NPU run. The desk assumption - about -54 dBFS,
    a gain deficit - was wrong by about 50 dB and of the opposite sign.
    """
cause         = """
    The int16 stream sits at a fixed +48 dB relative to a straight 24->16-bit
    alignment: MDF1's DFLTDR holds the 24-bit sample in bits [31:8]
    (MDF_DFLTDR_DR_Pos = 8), the BSP's `/256` extracts it, and the following
    SaturaLH(-32768, 32767) clips the top 8 bits - anything above -48 dBFS of
    MDF full scale clips hard (register reasoning in AUDIO-INPUT.md, not a
    direct measurement). The live `/256` is at
    Patch/stm32n6570_discovery_audio.c:3234 and :3259; the copies at
    :3172/:3197 are compiled out (USE_HAL_MDF_REGISTER_CALLBACKS = 0). The
    DK's microphone is an MP23DB01HP (stm32n6570_discovery_audio.h:194), not
    the IMP34DT05 named in ST's AED model config, which is unused metadata.
    """
workaround    = """
    Control on clipping, not on level: on any clipped sample drop MDF_GAIN by
    three steps (~3 dB each, range -16..+24) at once - a peak-targeting loop
    alone escapes slowly because a clipped capture reads 0.0 dBFS and its
    error saturates. Keep MDF acquiring continuously: HAL_MDF_SetGain() works
    only in HAL_MDF_STATE_ACQUISITION. Do not widen `/256` to `/16` (removes
    24 dB of headroom). Freeze adaptation when nothing decodes (an empty room
    winds a level loop to a rail). Print clipped-sample counts every
    utterance. Measured on canned audio: WER is flat at 6-8 % from -3.8 to
    -30 dBFS peak and int16 truncation costs nothing measurable; SNR is the
    variable (graceful to ~10 dB). BSP_AUDIO_IN_Record() caps the MDF
    half-buffer at 320 samples (DEFAULT_AUDIO_IN_BUFFER_SIZE), and 8-bit
    capture returns BSP_ERROR_FEATURE_NOT_SUPPORTED.
    """
silent        = true
is_infra      = false
detectable_statically = false
sources       = ["/home/claroche/stm32n6-tts/firmware/FRONTEND.md", "/home/claroche/stm32n6-tts/firmware/AUDIO-INPUT.md", "/home/claroche/stm32n6-tts/README.md", "/home/claroche/stm32n6-tts/firmware/WORKLIST.md"]

