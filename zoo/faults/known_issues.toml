[[issue]]
id            = "quantizing-every-mul-zeroes-gradient"
failure_class = "SILENT_GRADIENT_DESTRUCTION"
stage         = "quantize"
zoo_action    = "compile-postcondition"
title         = """
    SILENT: registering Mul for QDQ quantization zeroes the loss graph's
    gradient (norm 11.07 -> 0.00); Add degrades it to 0.54
    """
symptom       = """
    quantize_static completes without error, onnx.checker passes, the graph runs
    in ORT and returns finite scores - but the gradient output of the fused
    forward+backward loss graph collapses to exactly zero. Measured on the 1 s
    crop against the un-quantized-elementwise baseline of 11.07: +Sub gives
    11.07 (harmless), +Add gives 0.54 (severe degradation), +Mul gives 0.00
    (destroyed). Mul is simultaneously the op that matters for memory and the
    one that silently zeroes the gradient.
    """
cause         = """
    ORT's QDQ quantizer only knows Conv/Gemm/MatMul-family ops by default;
    elementwise ops can be forced in by binding them to QDQOperatorBase in the
    module-global QDQRegistry, which makes quantize_static insert Q/DQ around
    EVERY node of that type. The backward routes max-pool gradients through
    small Mul nodes deep in the fc backward whose values sit far below the
    per-tensor int8 grid chosen by MinMax calibration on the big tensors, so
    quantizing them rounds the surviving gradient signal to zero. Add is the
    same failure one order less severe.
    """
workaround    = """
    Never register Add. Register only Mul and Sub (ELEMENTWISE_QUANT_OPS) and
    restrict quantization to the peak-setting nodes: large_elementwise_nodes()
    runs shape inference, computes peak = max element count over
    value_info+output, sets cutoff = peak/4, and marks a Mul/Sub 'big' if
    prod(output dims) > cutoff (6 of 45 nodes on the 1 s crop); every 'small'
    node goes to nodes_to_exclude and stays fp32. GATE any
    elementwise-quantization change on gradient norm against the
    unquantized-elementwise baseline (11.07), not on whether the graph builds.
    Restore QDQRegistry afterwards - it is module-global (quantize_qdq wraps the
    call in a context manager). What is statically checkable is only the
    CONFIGURATION (is Mul registered / in op_types_to_quantize); the effect
    needs a numeric run. Note the memory payoff claimed to justify the -0.057
    MOS cost (1.95 MB fitting n6-noextmem) did NOT materialize on target.
    """
patch         = "quantize_only_peak_setting_elementwise"
silent        = true
is_infra      = false
detectable_statically = false
sources       = ["/home/claroche/dnsmos_exported/examples/convfsenet_ondevice/FEASIBILITY.md", "/home/claroche/dnsmos_exported/src/dnsmos_trainable/export.py"]

[[issue]]
id            = "activ-to-convacc-stream-link-stalls-npu"
failure_class = "NPU_STALL_ACTIV_TO_CONVACC_LINK"
stage         = "runtime"
zoo_action    = "compile-postcondition"
title         = """
    A Relu chained through the stream switch straight into a depthwise
    convolution's data port (ACTIV -> CONVACC port 0) stalls the NPU forever;
    the report says 0 SW, 0 hybrid
    """
symptom       = """
    Same board symptom as stride2-depthwise-conv-stalls-npu: one epoch starts
    and its POST_END never fires; no fault, no interrupt, no timeout. On
    Citrinet-256 it is the epoch that programs `Relu_857` on ACTIV_ACC_V2 1
    and `Conv2D_859_subm_0/1/2` (group=256, k=[7,1]) on three CONV_ACC_V2, and
    it moved with that operator across three schedules. The compile is clean:
    618 epochs, 0 SW, 0 hybrid under ST's stock options. 36 epochs of the graph
    carry such a link and the board never completed one; 582 do not and it
    completes them. Negative control on silicon: `epoch_num 348`, the same
    k=7 depthwise conv split across three accelerators but fed from a
    streaming engine (STRENG 0 -> CONVACC 0/1/3 port 0), completes in 178,933
    cycles. Three rounds first blamed the wrong node (a plain 1x1 conv two
    epochs earlier) because of an epoch-counter offset - see the amendment to
    sw-dequantizelinear-epoch-hang.
    """
cause         = """
    atonn canonicalises 1-D convolutions to 2-D and wraps each in Reshape
    3D<->4D pairs. At `Conv(4D) -> Q/DQ -> Reshape(4D->3D) -> Relu(3D) ->
    Reshape(3D->4D) -> depthwise Conv(4D)` the leading Reshape becomes an
    epoch of its own (a STRENG -> STRENG copy) that separates the Relu from its
    producer, so the compiler chains the Relu FORWARDS into its consumer:
    `ATONN_DSTPORT(STRSWITCH, 0, CONVACC, u, 0) <- ATONN_SRCPORT(STRSWITCH, 0,
    ACTIV, v, 0)`. Where nothing separates a conv from its Relu the chain runs
    CONVACC -> ARITH -> ACTIV -> STRENG and lands in memory; 26 such epochs
    execute below the stall. Silicon defect or a missing synchronisation /
    descriptor field in the compiler: open. What the evidence does and does
    not cover: the compiler emits the link at fan-out 1, 2, 3 and 4 and for
    depthwise K = 7..12 (not K = 1..6 or 13..15), but none of those
    reproducers - nor the 9-node one in REPRO-blocker2.md - has been run on a
    board, so "any ACTIV -> CONVACC link hangs" rests on the 36-of-36 /
    0-of-582 count in one graph plus the two-epoch control. Records disagree
    on the kernels: REPRO-blocker2.md and break_relu_chain.py call all 36 sites
    k=[7]; GATE4.md Round 18b says 20 are k=[7] (encoder.13-17) and 16 k=[9]
    (encoder.18-21).
    """
workaround    = """
    Postcondition: count stream-switch links in the generated network.c whose
    destination is a CONVACC port 0 and whose source is an ACTIV unit; a
    deployable build has ZERO. stm32n6-stt's compile/score_build.py does this
    (LINK regex at :49-51), and more usefully flags any (dst unit, dst port,
    src unit) combination outside the set silicon has executed (`PROVEN`,
    :31-47) - ACTIV -> CONVACC port 0 was exactly such an unproven link. The
    epoch table cannot see it. Fix in the graph: run the Relu and its Q/DQ on
    the 4-D tensor, `DQ -> Reshape([0,0,-1,1]) -> Relu -> Q -> DQ ->
    Reshape([0,0,-1]) -> Conv`, so atonn's fuse_consecutive_reshapes /
    eliminate_nop_reshape cancel its inserted pair and the Relu chains back
    into its producer. Exact by construction (max|diff| = 0 over 3,075,000
    outputs) and cheaper than the graph that stalled: 448 epochs vs 618, 300 kB
    cpuRAM2 vs 500 kB, 76,000,592 vs 92,450,794 estimated cycles, 124.035 ms
    measured. Reference: model/break_relu_chain.py (sites discovered; runs on
    the QDQ graph, after quantisation). SKIP any site whose Relu producer is
    not a Conv: rewriting `/encoder/encoder.22/mconv.0`, whose Relu follows a
    residual Add, CREATED a link the baseline did not have. Options measured
    not to help: --Oconv-split-cw/-kw/-stripe, --Ono-clone-dma, --Oauto-sched,
    --Omax-ca-pipe 1 (links remain); --Omax-ca-pipe 2 and
    --Oconv-split-stripe-full (compile fails); --d-onnx-temps (silently
    ignored, then crashes the wrapper); --onnx-omit-opt split_large_mask_conv
    (755 epochs, 92 SW, 46 hybrid). Only the debug-only
    --force-all-in-out-to-mem removes them: 1064 epochs, 0 SW, 800 kB cpuRAM2,
    194.0 ms measured. No option pins a named node to software; one node can
    be forced to SW by replacing its weight DequantizeLinear with a float32
    initializer (DQ -> Conv(float) -> Q as pure-SW epochs - measured on a
    subgraph), which the record prices at 144 SW epochs for the 36 sites.
    """
patch         = "keep_relu_on_4d_tensor"
silent        = false
