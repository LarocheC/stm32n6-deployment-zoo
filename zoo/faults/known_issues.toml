    Two plausible, wrong latencies. (1) DWT->CYCCNT read around an invoke
    printed 1,153,851,768 and 1,021,881,927 "cycles" - numbers that only
    looked like measurements. (2) Timing an M55 front end and then the invoke
    from the front end's end stamp reported the NPU at 1.7-1.9 M cycles while
