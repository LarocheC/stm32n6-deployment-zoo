[[issue]]
id            = "cmsis-rfft-init-links-every-twiddle-table"
failure_class = "LIBRARY_TABLES_BLOAT_IMAGE"
stage         = "board"
zoo_action    = "document-only"
title         = """
    INFRA, SILENT: CMSIS-DSP's arm_rfft_fast_init_f32(512) links the twiddle
    tables of every FFT size (158,052 B), and the vendor flags select the
    Helium path
    """
symptom       = """
    A minimal whole-program link of a log-mel front end grows from 14,084 B
    .text + 80 B .data (a built-in radix-2 FFT) to 127,284 B .text + 43,784 B
    .data with CMSIS-DSP, 158,052 B of it twiddle and bit-reversal tables.
    Nothing warns - against ST's 512 KiB application slot, with the stock app
    already at 238.8 KiB. The obvious trim (`-DARM_DSP_CONFIG_TABLES
    -DARM_FFT_ALLOW_TABLES -DARM_TABLE_TWIDDLECOEF_F32_256
    -DARM_TABLE_BITREVIDX_FLT_256 -DARM_TABLE_TWIDDLECOEF_RFFT_F32_512`) links
    at 12,172 B but contains no twiddle tables at all, so
    arm_rfft_fast_init_f32() would return ARM_MATH_ARGUMENT_ERROR at runtime.
    """
cause         = """
    arm_cfft_init_f32() is one switch over every supported length, so
    --gc-sections cannot drop any table, and the arm_cfft_sR_f32_* const
    structs are hidden behind `#if !defined(ARM_MATH_MVEF)`
    (arm_const_structs.c:95), so they are no escape in a Helium build. With the
    vendor Makefile's flags (-mcpu=cortex-m55 -mthumb -mfpu=fpv5-d16
    -mfloat-abi=hard) the preprocessor defines `__ARM_FEATURE_MVE 3`, so
    CMSIS-DSP compiles its Helium FFT (`_arm_radix4_butterfly_f32_mve`) while
    an x86 host harness exercises the scalar path, in a different summation
    order.
    """
workaround    = """
    Check the init status (fail loudly on ARM_MATH_ARGUMENT_ERROR) and check
    the signed binary against the slot (app-slot-512k-overflow-into-weights).
    In order of evidence: a self-contained FFT (14,084 B, 1 of 768,000 int8
    features off by 1 LSB against the oracle on the host, speed on the M55
    unmeasured); or keep CMSIS in a larger slot - stm32n6-stt shipped CMSIS
    with the weights moved to 0x70400000; table trimming only once correct
    macro names are known. The Helium path proved immaterial on silicon: over
    15 utterances 6 of 960,000 int8 features differed from the host oracle,
    each by 1 LSB in isolated mel bins, so forcing the scalar path
    (`-DARM_MATH_AUTOVECTORIZE`) was not needed. Note arm_rfft_fast_f32 packs
    the Nyquist bin into sp[1]; that is harmless only if nothing reads bin N/2.
    """
silent        = true
is_infra      = true
detectable_statically = false
sources       = ["/home/claroche/stm32n6-tts/firmware/FRONTEND.md", "/home/claroche/stm32n6-tts/docs/GATES-5-6.md", "/home/claroche/stm32n6-tts/board/BUILD.md"]

