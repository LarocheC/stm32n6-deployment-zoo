[[issue]]
id            = "power-loop-firmware-binds-zero-networks"
failure_class = "STALE_FIRMWARE_ZERO_NETWORK_BIND"
stage         = "board"
zoo_action    = "board-invariant"
title         = """
    INFRA: leftover power-harness main.c blocks ~125 s in power_loop() so
    validate sees zero registered networks
    """
error_signature = "E200(ValidationError): TARGET: Unable to bind the ST.AI runtime with \"network\" c-model: [] E801(HwIOError): Invalid firmware - /dev/ttyACM0:921600"
symptom       = """
    Every `stedgeai validate --mode target` fails, for the graphs under test AND
    for a known-good control graph. The firmware boots, answers serial and
    prints a valid banner, but the host binds ZERO networks. Looks exactly like
    a hardware/power-domain fault; WSL restart, Windows reboot, usbipd
    detach/attach, boot-switch flip, clean gen dirs and gdb re-load all fail to
    fix it.
    """
cause         = """
    The NPU_Validation app's `Core/Src/main.c` had been replaced by the
    power-harness variant
    (`deploy/stm32n6/power_harness/main_with_power_loop.c`), which inserts
    `power_loop()` between `aiValidationInit()` and `aiValidationProcess()`.
    power_loop() runs a fixed ~125 s schedule, so the firmware initialises the
    network correctly and then sits in the power loop for two minutes before
    ever reaching the code that serves the host protocol; the host handshake
    always lands inside that window. NOT the jumpers and not the graphs.
    """
workaround    = """
    Read the firmware banner on /dev/ttyACM0 BEFORE blaming hardware - the tell
    was the first banner line `PWR_DONE fid=4674 sat=46737 rt=1875`, printed by
    power_loop() on completion. Restore the stock `Core/Src/main.c` from
    `main.c.pwr_orig` (byte-identical to main.c.rt_bak/main.c.loss_bak) and keep
    the power version as `main.c.pwr_loop_saved`. Restoring main.c forces a
    relink, which then trips the GCC_PATH/Error-127 gotcha, so export GCC_PATH
    too. Always bracket a campaign with a control graph whose latency is known.
    """
silent        = false
is_infra      = true
detectable_statically = false
sources       = ["/home/claroche/eco8-neaixt/n6_band_debug_kit/HANDOVER.md", "/home/claroche/eco8-neaixt/n6_band_debug_kit/RESULTS.md"]

