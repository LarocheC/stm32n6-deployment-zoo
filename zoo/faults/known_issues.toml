[[issue]]
id            = "qdq-split-consumers-break-equality-mask"
failure_class = "QDQ_TENSOR_INSTANCE_SPLIT"
stage         = "quantize"
zoo_action    = "graph-patch"
title         = """
    SILENT: quantize_static rewires only some consumers to the DQ output, so
    Equal() masks are never true and the gradient is zero
    """
symptom       = """
    The quantized graph is checker-clean and runs, but every max-pool /
    global-max gradient route through an Equal(x, max_up) mask evaluates
    all-false, so the whole gradient is silently zero. No tool reports anything.
    """
cause         = """
    quantize_static rewires *some* consumers of a quantized tensor to the
    DequantizeLinear output and leaves others on the original float instance. An
    equality mask then compares the float instance against a max taken over the
    dequantized instance; the two differ by the quantization error, so the
    comparison is never satisfied and the mask zeroes the gradient it was
    supposed to route.
    """
workaround    = """
    Run repair_mask_consistency over the QUANTIZED artifact (export.quantize_qdq
    calls it unconditionally after quantize_static). For every Equal whose
    input[1] is not an initializer, walk producers up through {MaxPool,
    ReduceMax, Unsqueeze, Reshape, Concat, Pad, QuantizeLinear,
    DequantizeLinear, Squeeze, Transpose} until a MaxPool/ReduceMax; if the
    chain contains any Q/DQ node or its source differs from the Equal's first
    input, clone the chain (dropping Q/DQ), re-root it at the exact tensor
    instance input[0] reads, rewire every clone input matching the original
    predecessor (Concat 'stack' repeats it), and repoint Equal.input[1].
    Max-of-the-same-tensor is then exact by construction. Lint predicate: any
    Equal whose two operands straddle a Q/DQ boundary - checkable on the
    quantized ONNX, before compiling.
    """
patch         = "repair_mask_consistency"
silent        = true
is_infra      = false
detectable_statically = true
sources       = ["/home/claroche/dnsmos_exported/src/dnsmos_trainable/export.py"]

