[[issue]]
id            = "shared-initializer-matmul-per-channel-crash"
failure_class = "PER_CHANNEL_BIAS_SCALE_MISMATCH"
stage         = "quantize"
zoo_action    = "lint-rule"
title         = """
    Per-channel quantization crashes when the dynamo exporter dedupes one weight
    initializer across a Gemm/Conv and a backward MatMul
    """
symptom       = """
    quantize_static raises during per-channel weight/int32-bias handling: the
    number of per-channel scales derived for the shared initializer does not
    match the bias length of one of its consumers. The interpreter traceback
    text is not recorded in the source.
    """
cause         = """
    The dynamo exporter deduplicates identical initializers, so a loss graph's
