    tensors directly (integer equality is exact when both sides share a scale)
    and emit an int8 0/1 mask so the chain stays int8 end to end. Even then
    Log/Reciprocal keep a small int8<->float boundary, so this is a memory
    optimization, not a reliable workaround for the underlying ST runtime
    defect.
