id            = "validate-refuses-unfused-gemm-graph"
failure_class = "FRONTEND_INTERNAL_ERROR"
stage         = "validate"
zoo_action    = "document-only"
title         = """
    stedgeai validate re-runs ORT optimization, re-introduces the Gemm fusion
    the export avoided, and crashes
    """
error_signature = "INTERNAL ERROR: Overwriting Entry 0 of _Mul_5_output_0"
symptom       = """
    A model that generates and runs on the board cannot be validated: `stedgeai
    validate --mode target` crashes on the reference model. The workaround for
    the activation-C Gemm blocker is therefore not measurable through validate
    at all.
    """
cause         = """
    The validate path runs ORT optimization on the reference ONNX internally,
    re-creating the MatMulAddFusion / activation-C Gemm that
    `skip_optimization=True` was used to prevent.
    """
workaround    = """
    Do not use `validate` for un-fused models: load with n6_loader.py and
    measure with `npu_profiler.py` against the already-loaded firmware, then
    verify accuracy off-board (host ORT int8-vs-FP32 cosine) instead of via
    validate's on-target cross-check. Predicting the crash means running ORT's
    optimizer on the reference ONNX and looking for a re-created activation-C
    Gemm - offline and ST-free, but not a pure schema lint.
    """
silent        = false
is_infra      = false
detectable_statically = true
