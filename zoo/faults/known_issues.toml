    onnx.shape_inference.infer_shapes(strict_mode=False, data_prop=True), build
    a const table from initializers plus Constant-node attribute tensors, and
    for every Slice with a fully static input[0] and constant starts/ends
    compute new_start = s+d if s<0 else min(s,d); new_end = e+d if e<0 else
    min(e,d) per axis, emitting `{node}_starts_norm`/`{node}_ends_norm` int64
    initializers. Idempotent (skip when nothing changed). Implemented as patch 1
    in patch_for_stedgeai.py; parity-checked bit-exact in ORT. Reimplementation
    caveats: steps (input[4]) are untouched and the rewrite is only
    value-preserving for positive unit steps - gate on step>0 or absent;
    INT64_MIN is not normalized.
