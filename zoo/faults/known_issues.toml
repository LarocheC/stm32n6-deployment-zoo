id            = "analytic-activation-peak-is-lower-bound"
failure_class = "ON_CHIP_ALLOCATION_FAILURE"
stage         = "compile"
zoo_action    = "compile-postcondition"
title         = """
    Host-side activation-peak estimates are a lower bound, not an allocation
    (1.95 MB estimate -> 116 MB unallocatable)
    """
symptom       = """
    budget.py reported a fused-QDQ activation peak of 1.95 MB and printed that
    the artifact fits the 2.8 MB `n6-noextmem` pool. atonn then reported 116 MB
    unallocatable on the on-chip pools and the graph only built under
    `n6-allmems-O3` with 23.3 MB of activations (20.6 MB in hyperRAM) - a ~12x
    miss on the same int8+elementwise artifact. The 1 s forward crop likewise
    fails n6-noextmem allocation and needs n6-allmems-O3 with 5.0 MB in
    hyperRAM.
    """
cause         = """
    peak_activation returns the size of the single largest live tensor. It is
    not a liveness/allocation analysis: it ignores simultaneously-live tensors,
    scratch/workspace buffers, per-epoch double buffering, alignment and pool
    granularity, and any layout transform the compiler applies. Both analytic
    conventions are lower bounds - ORT-CPU (7.78 MB, materializes floats between
    Q/DQ pairs) and fused-QDQ (1.95 MB) - and the earlier rule 'only the fused
    number decides on-chip fit' is refuted: neither decided it; the allocator's
    per-pool assignment is the only authority.
    """
workaround    = """
    Treat every analytic peak as a strict LOWER BOUND, never as a pass/fail
    gate, and report which convention is in use. Confirm with `stedgeai
    generate` / `stedgeai validate --mode target` before claiming a pool fit;
    fall back to `n6-allmems-O3` (hyperRAM) or shrink the window. For reference,
    budget.weight_bytes(model) = sum(numpy_helper.to_array(t).nbytes for t in
    graph.initializer) counts EVERY initializer including QDQ scale/zero-point
    tensors and int64 shape constants at real dtype width, and materializes each
    tensor (external-data models must be loadable).
    """
silent        = false
