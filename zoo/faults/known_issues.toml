[[issue]]
id            = "sw-dequantizelinear-epoch-hang"
failure_class = "DEVICE_HANG_IN_SW_EPOCH"
stage         = "runtime"
zoo_action    = "board-invariant"
title         = """
    Firmware never returns from a pure-SW DequantizeLinear epoch when the fp32
    elementwise buffer grows
    """
symptom       = """
    No error at all. On crop1s_int8_d2_rows_dev2 (204 epochs: 33 HW / 46 hybrid
    / 125 SW, 2.36 MB weights, 23.3 MB activations, outputs 2 small + 256 kB)
    report epochs epoch_1..epoch_64 complete in 2.5-4.9 s total (last: epoch_64,
    Sub(float)), then the firmware NEVER returns from epoch_65 of 204 - a
    pure-SW `DequantizeLinear` in the backward's first `Equal/Cast/Sub/Mul` mask
    block, the peak-setting fp32 region, hyperRAM resident. Waited >10 min
    twice; identical stop point across five loads and on both -O3 and -O1
    builds. It reads exactly like a wedged board.
    """
cause         = """
    Not the graph (identical outputs in ORT; the first 63 epochs run on target):
    the ll_aton SW kernel and/or the hyperRAM placement of the peak-setting fp32
    region. Believed by the reporter to be the same defect as the
    large-software-epoch-output corruption, with the hang being the
    larger-buffer manifestation (256 kB vs 64 kB); confirmation was an open
    question to ST. Size/placement-dependent: the same topology cropped to 0.25
    s completes all 205 epochs (4.80 s/window, activations 6.7 MB). NOT a board
    or load flake - and it must not be confused with the ST-LINK wedge, which
    has a distinct signature.
    """
workaround    = """
    Shrink the fp32 elementwise/dequantize region so it fits on-chip SRAM: crop
    the adaptation window to <=0.25 s, or quantize the mask chain itself.
    Instrument with the LL_ATON epoch callback to identify the stalling epoch -
    NOTE the runtime callback index is 0-based while the generate report's epoch
    IDs are 1-based, so translate before quoting an epoch number. Before
    spending time on the board, reload and rebuild at a different optimization
    level to confirm the stop point is reproducible; do not re-flash or
    power-cycle chasing an infra fault. Escalated to ST with
    n6_gen/dnsmos_loss_crop1s_int8_d2 plus the reproduction.
    Two traps measured later (stm32n6-stt Gate 4). (1) Through the stai API -
    which ST's GettingStarted applications use - a callback registered with
    LL_ATON_RT_SetNetworkCallback() is overwritten on every run and never
    fires; see stai-layer-discards-epoch-callback. (2) Do not assume any fixed
    offset: a software counter incremented per POST_END equals the index into
    ll_atonn_rt_epoch_block_array, and atonn's epoch_num there starts at 2
    (the parameter and input pseudo-epochs), so epoch_num = counter + 2.
    Print eb->epoch_num, or the in/out streaming-engine masks, and look them up
    in network.c's epoch-block table; repeating the run on a second schedule
    (--Omax-ca-pipe 1) separates an operator fault from a schedule fault.
    Judge a hang from a flash boot: under gdb debug events nudge the WFE loop
    and a stuck epoch reads as extreme slowness.
    """
patch         = "crop_adaptation_window_0p25s"
silent        = false
is_infra      = false
detectable_statically = false
sources       = ["/home/claroche/dnsmos_exported/examples/convfsenet_ondevice/ONBOARD_RESULTS.md", "/home/claroche/dnsmos_exported/examples/convfsenet_ondevice/ST_BUG_REPORT.md", "/home/claroche/stm32n6-tts/board/GATE4.md", "/home/claroche/stm32n6-tts/firmware/vendor-mods/gate4.patch"]

