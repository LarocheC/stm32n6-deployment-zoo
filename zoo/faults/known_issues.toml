id            = "fnb58-interrupt-out-fails-over-usbip"
failure_class = "USBIP_INTERRUPT_ENDPOINT_FAILURE"
stage         = "board"
zoo_action    = "document-only"
title         = """
    INFRA: the USB power meter cannot be driven from WSL2/usbip - interrupt-OUT
    transfers always time out
    """
error_signature = "vhci_hcd: urb->status -104"
symptom       = """
    Control transfers to the FNB58 succeed (descriptors, product string) and
    reads on EP 0x83 return real packets, but every interrupt-OUT write times
    out with the kernel logging `vhci_hcd: urb->status -104` (ECONNRESET)
    continuously, so the meter never starts streaming. `usbipd detach` leaves
    the device in Windows' \"Device in error state\". Cost several hours and
    produced an incorrect \"the meter is faulty\" conclusion that was later
    retracted.
    """
cause         = """
    usbip does not carry the interrupt-OUT endpoint reliably for this device,
    and the start command must arrive on that endpoint (an HID SET_REPORT
    substitute over the control pipe is accepted, reporting 64 bytes written,
    but does not start the stream).
    """
workaround    = """
    Drive the meter natively on Windows and keep usbip out of the path; the
    working call is `HidD_SetOutputReport` (Windows HID SET_REPORT with the
    report-ID byte), NOT `FileStream.Write` or libusb interrupt OUT. NEVER call
    `usb.set_configuration()` on this meter - it triggers a USB reset into the
    \"descriptor request failed\" state recoverable only by physical replug.
    Windows logs the CSV while WSL flashes/runs/analyses; the firmware fiducial
    aligns the two without a shared clock.
    """
silent        = false
