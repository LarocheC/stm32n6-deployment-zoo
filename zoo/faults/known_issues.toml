[[issue]]
id            = "quantizing-every-mul-zeroes-gradient"
failure_class = "SILENT_GRADIENT_DESTRUCTION"
stage         = "quantize"
zoo_action    = "compile-postcondition"
title         = """
    SILENT: registering Mul for QDQ quantization zeroes the loss graph's
    gradient (norm 11.07 -> 0.00); Add degrades it to 0.54
    """
symptom       = """
    quantize_static completes without error, onnx.checker passes, the graph runs
    in ORT and returns finite scores - but the gradient output of the fused
    forward+backward loss graph collapses to exactly zero. Measured on the 1 s
    crop against the un-quantized-elementwise baseline of 11.07: +Sub gives
    11.07 (harmless), +Add gives 0.54 (severe degradation), +Mul gives 0.00
    (destroyed). Mul is simultaneously the op that matters for memory and the
    one that silently zeroes the gradient.
    """
cause         = """
    ORT's QDQ quantizer only knows Conv/Gemm/MatMul-family ops by default;
    elementwise ops can be forced in by binding them to QDQOperatorBase in the
    module-global QDQRegistry, which makes quantize_static insert Q/DQ around
    EVERY node of that type. The backward routes max-pool gradients through
    small Mul nodes deep in the fc backward whose values sit far below the
    per-tensor int8 grid chosen by MinMax calibration on the big tensors, so
    quantizing them rounds the surviving gradient signal to zero. Add is the
    same failure one order less severe.
    """
workaround    = """
    Never register Add. Register only Mul and Sub (ELEMENTWISE_QUANT_OPS) and
    restrict quantization to the peak-setting nodes: large_elementwise_nodes()
    runs shape inference, computes peak = max element count over
    value_info+output, sets cutoff = peak/4, and marks a Mul/Sub 'big' if
    prod(output dims) > cutoff (6 of 45 nodes on the 1 s crop); every 'small'
    node goes to nodes_to_exclude and stays fp32. GATE any
    elementwise-quantization change on gradient norm against the
    unquantized-elementwise baseline (11.07), not on whether the graph builds.
    Restore QDQRegistry afterwards - it is module-global (quantize_qdq wraps the
    call in a context manager). What is statically checkable is only the
    CONFIGURATION (is Mul registered / in op_types_to_quantize); the effect
    needs a numeric run. Note the memory payoff claimed to justify the -0.057
    MOS cost (1.95 MB fitting n6-noextmem) did NOT materialize on target.
    """
patch         = "quantize_only_peak_setting_elementwise"
silent        = true
is_infra      = false
detectable_statically = false
sources       = ["/home/claroche/dnsmos_exported/examples/convfsenet_ondevice/FEASIBILITY.md", "/home/claroche/dnsmos_exported/src/dnsmos_trainable/export.py"]

