title         = """
    INFRA: ST's audio pre/post-processing contexts scale with the spectrogram
    length - at 800 columns AudioBM_proc_t alone is 2.07x the app's RAM region
    """
symptom       = """
    Resizing ST's audio application for a model with a longer input window
    (COL 96 -> 800, NMEL 64 -> 80) fails at LINK time. Measured sizeof() on the
    target: AudioBM_proc_t 268,048 B at stock -> 2,166,032 B, plus a runtime
    ring-buffer malloc of 513,280 B: 2,679,312 B against `RAM ... LENGTH =
    1023K` = 1,047,552 B (STM32N657XX_LRUN.ld:47). A plan that summed only
    proc_buff + audio_out + the ring buffer (1,026,240 B) predicted a runtime
    malloc failure; it fails earlier, and by 2.6x.
    """
cause         = """
    AudioProcCtx_f16_t carries `pCplxSpectrum[(NFFT/2+1)*2*COL]` of float16_t
    (Projects/Dpu/audio_proc.h:64; 822,400 B at NFFT 512, COL 800), and
    AudioBM_proc_t holds two of them: the post-processing context is #defined
    to the same type (Projects/Dpu/postproc_dpu.h:37, audio_bm.h:61-62).
    """
workaround    = """
    Do not instantiate ST's pre/post contexts outside the AED geometry: replace
    AudioBM_proc_t with a bare AIProcCtx_t (stm32n6-stt's GATE4_CANNED path,
    ~269 KB of .bss saved) and bring your own front end - ST's PreProc_DPU is
    float16 and cannot express a NeMo-style log-mel anyway (see
    st-audio-preprocessing-library-cannot-express-nemo-logmel). For capture,
    keep BSP_AUDIO_IN_Record() and the two transfer callbacks and append into
    an unclaimed AXISRAM bank (AXISRAM3 at 0x34200000); an utterance design
    needs no ring buffer. Check `arm-none-eabi-size` against the region rather
    than a hand-summed table.
    """
