[[issue]]
id            = "st-audio-preprocessing-library-cannot-express-nemo-logmel"
failure_class = "VENDOR_FRONTEND_SEMANTICS_MISMATCH"
stage         = "runtime"
zoo_action    = "document-only"
title         = """
    SILENT: ST's STM32_AI_AudioPreprocessing_Library clamps the log at FLT_MIN
    and its float16 path takes logf(0) = -inf - 96 % of a NeMo log-mel moves
    """
symptom       = """
    Replacing NeMo's ln(x + 2^-24) with ST's `if (x <= 0) x = FLT_MIN;
    logf(x);` and changing nothing else moves 737,335 of 768,000 int8 features
    (96.01 %), max |d| 46 LSB, log floor -16.64 -> -87.34. On the float16 path
    FLT_MIN assigned into a float16_t underflows to exactly 0 and the next line
    takes logf(0) = -inf, on 3,098-37,721 of 64,000 mel bins per utterance of
    ordinary speech. Nothing errors.
    """
cause         = """
    LogMelSpectrogramColumn_q15_Q8() (feature_extraction.c:250-324) clamps
    instead of adding a guard (:293-298, :315-317), has no per-mel-bin
    normalisation, and quantises inline per column (:320-323), before the
    statistics a per-feature z-score needs exist; Window_Init() builds a
    periodic Hann (window.c:78). The audio app is wired to float16
    (app_config.h:51; audio_bm.h:28-33 #error if changed), and 2^-24 is
    exactly float16's smallest subnormal.
    """
workaround    = """
    Write the front end: float32, two passes (per-column log-mel into a
    scratch buffer, then per-bin mean and std(ddof=1) and quantise), tested
    bit-exact against the model's own Python front end - stm32n6-stt's
    citrinet_fe.c matched 0 of 768,000 on the host and 6 of 960,000 at 1 LSB
    on silicon. Keep float32 scratch unless the cost is priced (float16
    scratch: 3,982 of 768,000 off by 1 LSB), accumulate variance in double
    (float32 sum/sumsq: 236 of 768,000), use rintf (round-half-even) not
    roundf. Budget it: 136.0 ms on the M55 for an 8 s window, as much as the
    whole NPU encoder.
    """
silent        = true
is_infra      = false
detectable_statically = false
