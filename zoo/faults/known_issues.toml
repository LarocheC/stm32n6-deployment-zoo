[[issue]]
id            = "sw-epoch-large-output-corruption"
failure_class = "SILENT_RUNTIME_OUTPUT_CORRUPTION"
stage         = "runtime"
zoo_action    = "board-invariant"
title         = """
    SILENT: a large tensor written as a graph output by a software epoch comes
    back corrupt while small outputs are exact
    """
symptom       = """
    Same inference, two outputs: the small one is exact, the large one is
    garbage. On the pure-fp32 PESQ loss graph (169 epochs: 13 HW / 18 hybrid /
    138 SW, 2.70 MB weights, 3.49 MB activations, n6-allmems-O3) the score
    matches the host to the digit (3.292/1.104/3.647) while the 64.7 kB grad_enh
    [1,257,63] output is corrupt by 9-11 orders of magnitude (cosine
    -0.022/0.002/-0.005, ratio 1.6e9-6.8e10). `stedgeai generate` completes with
    no error and no warning. The pattern holds across every network measured:
    trunk (1 output + 9 states) correct 4.24 ms, DNSMOS forward (2 tiny)
    correct, PESQ predictor (1 tiny) exact to 0.006 PESQ, PESQ loss (tiny + 64.7
    kB) half corrupt, DNSMOS loss (2 tiny + 64 kB) all corrupt.
    """
cause         = """
    Vendor defect in generated code / NPU runtime when a software epoch writes a
    large graph output - the buffer is either not committed to the address the
    runtime reports, or committed with the wrong stride/type/size, so the host
    reads uninitialized or partially-written memory. It reproduces with NO
    quantization anywhere, so the discriminating variable is a LARGE OUTPUT
    TENSOR EMITTED BY A SOFTWARE EPOCH, not quantization. RULED OUT: bad
    ONNX/unsupported construct (lint + generate clean); front-end miscompilation
    (the *_OE_*.onnx runs correctly in ORT); host driver / protobuf I/O (a bare
    LL_ATON runner with the input baked into flash gives the same wrong bits);
    input not reaching the device (byte-correct on chip, verified by read-back
    and SWD dump); wrong input byte order (both layouts tested); optimization
    level (-O3 == -O1); cache maintenance (no --Ocache-opt/--cache-maintenance
    plus explicit clean/invalidate identical); input/output aliasing (allocator
    had put wav and grad_wav both at 0x342e0000; --Opreserve-inputs separated
    them to 0x342e0000/0x342e3e90, identically wrong); degenerate input
    (zeros/0x80/tiny give 2.395/2.743/1.756 in ORT, not the device constant);
    graph inherently input-independent (only 2 of 277 OE tensors are).
    """
workaround    = """
    No fix known; reported to ST as an open defect against ST Edge AI Core
    v4.0.1-20581 (7ed50de05) / LL_ATON v1.1.3. Mitigations that work: keep every
    graph output small (all-small-output networks are correct on the same
    board), split a large software-epoch output into small outputs, or recompute
    it on the host. Treat ANY graph output larger than a few kB produced by a SW
    epoch as unverified until compared against the host on several inputs.
    Diagnostic protocol: run the compiler's own *_OE_*.onnx in ORT (correct)
    against the device (wrong) - one step separates front end from runtime. Do
    not chase cache, layout, optimization level or aliasing. Recommended ST
    reproducer: the PESQ loss graph - fp32-only, 169 epochs, no
    hand-quantization, no BOOL-JSON workaround, self-checking (score exact +
    gradient wrong in the same inference). A lint can only approximate this
    pre-compile by flagging large graph outputs; SW-epoch attribution needs the
    compile report.
    """
silent        = true
is_infra      = false
detectable_statically = false
sources       = ["/home/claroche/dnsmos_exported/examples/convfsenet_ondevice/ONBOARD_RESULTS.md", "/home/claroche/dnsmos_exported/examples/convfsenet_ondevice/ST_BUG_REPORT.md"]

