# Drafted by `zoo init`. Every TODO is a question the drafter could not
# answer from the graph — review them before running the funnel.
schema = 1
id      = "silero-vad"
source  = "onnx-community/silero-vad"
domain  = "audio"
task    = "voice-activity-detection"
tier    = 1        # 1=screen  2=measure on board  3=firmware demo
license = "mit"
notes   = "lab/silero-vad.md"

[fetch]
provider = "hf_onnx"
revision = "main"   # TODO: pin to a commit sha once it screens clean

[[graph]]
id   = "model"
file = "onnx/model.onnx"
# fp32 on disk: 2.2 MB
realtime_ms = 0.0   # TODO: wall-clock covered by one invocation (for RTF)
# WARNING: anonymous dynamic axes input[0], input[1], state[1] — --fix-parametric-shapes keys on names, so these need a re-export.

  [[graph.input]]
  name  = "input"
  role  = "feature"
  shape = ["?", "?"]
  dtype = "float32"
  calib = "TODO"   # calibration provider key

  [[graph.input]]
  name  = "state"
  role  = "state"
  shape = [2, "?", 128]
  dtype = "float32"
  feeds_from = "stateN"
  init = "zeros"

  [[graph.input]]
  name  = "sr"
  role  = "constant"
  shape = []
  dtype = "int64"
  value = 0   # TODO: the scalar to fold in

  [[graph.output]]
  name = "output"
  # shape ["unk__54", 1]

  [[graph.output]]
  name = "stateN"
  # shape ["unk__55", "unk__56", "unk__57"]

[variants]
profile         = ["onchip", "extflash", "allmems"]
precision       = ["int8"]
backend         = ["npu", "m55"]   # m55 gives the NPU-vs-CPU speedup
policy          = "first_success"

[calibration]
provider = "synthetic"   # TODO: a real provider is required for tier 2
n        = 128
seed     = 0
