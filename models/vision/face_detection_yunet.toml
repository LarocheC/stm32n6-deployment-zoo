# Drafted by `zoo init`. Every TODO is a question the drafter could not
# answer from the graph — review them before running the funnel.
schema = 1
id      = "face_detection_yunet"
source  = "opencv/face_detection_yunet"
domain  = "vision"
task    = "face-detection"
tier    = 1        # 1=screen  2=measure on board  3=firmware demo
license = "unknown"
notes   = "lab/face_detection_yunet.md"

# NOTE: 640x640 gives a 12.8 MB fp32 activation peak (~3.2 MB int8), above the
# ~2.8 MB on-chip pool. Re-export at 320x320 before promoting: ST measured this
# model at 320 with 1130 KB activation and 6.74 ms on this board.

[fetch]
provider = "hf_onnx"
revision = "main"   # TODO: pin to a commit sha once it screens clean

[[graph]]
id   = "face-detection-yunet-2023mar"
file = "face_detection_yunet_2023mar.onnx"
# fp32 on disk: 0.2 MB
realtime_ms = 33.3   # one camera frame at 30 fps

  [[graph.input]]
  name  = "input"
  role  = "feature"
  shape = [1, 3, 640, 640]
  dtype = "float32"
  calib = "image_folder"

  [[graph.output]]
  name = "cls_8"
  # shape [1, 6400, 1]

  [[graph.output]]
  name = "cls_16"
  # shape [1, 1600, 1]

  [[graph.output]]
  name = "cls_32"
  # shape [1, 400, 1]

  [[graph.output]]
  name = "obj_8"
  # shape [1, 6400, 1]

  [[graph.output]]
  name = "obj_16"
  # shape [1, 1600, 1]

  [[graph.output]]
  name = "obj_32"
  # shape [1, 400, 1]

  [[graph.output]]
  name = "bbox_8"
  # shape [1, 6400, 4]

  [[graph.output]]
  name = "bbox_16"
  # shape [1, 1600, 4]

  [[graph.output]]
  name = "bbox_32"
  # shape [1, 400, 4]

  [[graph.output]]
  name = "kps_8"
  # shape [1, 6400, 10]

  [[graph.output]]
  name = "kps_16"
  # shape [1, 1600, 10]

  [[graph.output]]
  name = "kps_32"
  # shape [1, 400, 10]

[[graph]]
# The same file, re-resolved at 320x320. At 640 this model spills its
# activations to PSRAM and measured 161.61 ms on this board; ST publish 6.74 ms
# for the same architecture at 320. The zoo's own screen flagged
# `activations-in-psram` before anything was compiled, so this row is the test
# of whether that advice is actionable — and of whether "re-export at 320"
# needs an export at all. It does not: every Reshape here is `[1, -1, k]` and
# both Resizes are scale-driven, so setting the input dimension and re-running
# shape inference produces the 320 graph exactly.
id   = "face-detection-yunet-2023mar-320"
file = "face_detection_yunet_2023mar.onnx"
realtime_ms = 33.3   # one camera frame at 30 fps

  [graph.resolution]
  input = [1, 3, 320, 320]

  [[graph.input]]
  name  = "input"
  role  = "feature"
  shape = [1, 3, 320, 320]
  dtype = "float32"
  calib = "image_folder"

  [[graph.output]]
  name = "cls_8"
  # shape [1, 1600, 1] at this resolution

  [[graph.output]]
  name = "cls_16"

  [[graph.output]]
  name = "cls_32"

  [[graph.output]]
  name = "obj_8"

  [[graph.output]]
  name = "obj_16"

  [[graph.output]]
  name = "obj_32"

  [[graph.output]]
  name = "bbox_8"

  [[graph.output]]
  name = "bbox_16"

  [[graph.output]]
  name = "bbox_32"

  [[graph.output]]
  name = "kps_8"

  [[graph.output]]
  name = "kps_16"

  [[graph.output]]
  name = "kps_32"

[variants]
profile         = ["onchip", "extflash", "allmems"]
precision       = ["int8"]
backend         = ["npu", "m55"]   # m55 gives the NPU-vs-CPU speedup
policy          = "first_success"

[calibration]
# OpenCV's FaceDetectorYN::detect calls `blobFromImage(pad_image)` with default
# arguments — scalefactor 1.0, no mean subtraction, and OpenCV's native BGR
# order. So this network is fed raw 0-255 BGR pixels, and calibrating it on
# [0, 1] would set every activation scale 255x too small.
provider = "image_folder"
dataset  = "~/datasets/tiny-imagenet-200/valid"
n        = 128
seed     = 0

  [calibration.options]
  scale = 255.0
  bgr   = true
