# Drafted by `zoo init`. Every TODO is a question the drafter could not
# answer from the graph — review them before running the funnel.
schema = 1
id      = "mobilenet_v2_1.0_224"
source  = "onnx-community/mobilenet_v2_1.0_224"
domain  = "vision"
task    = "image-classification"
tier    = 1        # 1=screen  2=measure on board  3=firmware demo
license = "TODO"
notes   = "lab/mobilenet_v2_1.0_224.md"

[fetch]
provider = "hf_onnx"
revision = "main"   # TODO: pin to a commit sha once it screens clean

[[graph]]
id   = "model"
file = "onnx/model.onnx"
# fp32 on disk: 14.0 MB
realtime_ms = 0.0   # TODO: wall-clock covered by one invocation (for RTF)

[graph.pin]   # TODO: every symbolic dim must be fixed before compiling
"batch_size" = 1

  [[graph.input]]
  name  = "pixel_values"
  role  = "feature"
  shape = ["batch_size", 3, 224, 224]
  dtype = "float32"
  calib = "image_folder"

  [[graph.output]]
  name = "logits"
  # shape ["batch_size", 1001]

[variants]
profile         = ["onchip", "extflash", "allmems"]
precision       = ["int8"]
backend         = ["npu", "m55"]   # m55 gives the NPU-vs-CPU speedup
policy          = "first_success"

[calibration]
# From the repo's own preprocessor_config.json: rescale_factor 1/255, then
# image_mean 0.5 / image_std 0.5 — the TensorFlow-style [-1, 1] convention,
# not ImageNet mean/std.
provider = "image_folder"
dataset  = "~/datasets/tiny-imagenet-200/valid"
n        = 128
seed     = 0

  [calibration.options]
  mean = 0.5
  std  = 0.5
