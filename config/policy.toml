# Every threshold the funnel applies lives here, so a verdict can always be
# traced to a number someone chose on purpose. Changing a value here changes
# verdicts; the file's git sha is part of every cache key.

[lint]
# ST Edge AI Core caps opset at 20, but 13 is what the front end is happiest
# with and what both prior projects pinned their device artifacts to. The
# dynamo exporter cannot go below 18, which is why device exports use
# torch.onnx.export(dynamo=False).
max_opset = 20
preferred_opset = 13
max_ir_version = 8

# The compiler rejects ANY tensor dimension at or above 65536 -- interior
# tensors included, not just graph I/O. This is why a flat [1, 144160] layout
# had to become [1, 901, 160] in the dnsmos work.
max_tensor_dim = 65535

# Rank 5 segfaults the compiler (signo=11), reproducibly.
max_rank = 4

# Control flow has no mapping at all. `If` is why onnx-community/silero-vad is
# unusable: its entire network sits inside two If branches.
forbidden_ops = ["If", "Loop", "Scan", "NonZero"]

# Advisory ceiling on Cortex-M55 software epochs. Not a hard reject -- every
# real model has some -- but past this the model is epoch-bound by
# construction and the latency prediction should say so loudly.
warn_sw_ops = 12
max_sw_ops = 40

[budget]
# Usable on-chip pool for the SCREENING harness mpool: cpuRAM2 (1024 KB) plus
# npuRAM3-6 (4 x 448 KB) = 2,883,584 B of declared bank. The compiler reserves
# 8 B per allocatable pool (`alignment: 8`), so `network.c`'s pool table reports
# the merged virtual pool as 2,883,576 and that is the number to budget against.
# Beware: `network_c_info.json` - which is what zoo/st/cinfo.py parses - reports
# `size_bytes: 2883584` for the SAME pool, so a check that compares a parsed
# pool size against this constant is off by 8 and should compare fractions or
# allow the slack. (Same 8 B on every non-zero pool of a non-virtual mpool too;
# seen in six zoo compiles and stm32n6-stt's Citrinet compile.)
onchip_bytes = 2883576
hyperram_bytes = 33554432      # 32 MB HexaSPI PSRAM
octoflash_bytes = 117440512    # 112 MB OctoSPI NOR, read-only

# The demo-tier applications reserve memory for themselves, so a model that
# screens fine can still be too big to promote. Checked at promotion time.
# 1472 KB = cpuRAM2 (1024 KB) + npuRAM6 (448 KB), the only two non-zero internal
# pools in ST's Projects/X-CUBE-AI/models/stm32n6.mpool (8 B reservation each, so
# 1,507,312 usable). Two cautions, both from stm32n6-stt:
#   - the same mpool offers 16 MB of hyperRAM, so this is a target the compiler
#     will silently exceed by spilling, not a ceiling it enforces (atlas:
#     psram-spill-with-zero-sw-epochs);
#   - it is ST's conservative default, NOT a hardware ceiling: audio_bm.c's
#     Int_Mem_Config() powers and clocks AXISRAM3/4/5 too and nothing claims
#     them (the app's only linker region is AXISRAM1), so declaring them in the
#     mpool widens this to 2,883,584 B. Before relying on that, check whether the
#     wider pool gives a BETTER schedule or merely a legal one (bank allocation
#     affects NPU port contention), and whether the final app wants those banks.
audio_app_onchip_bytes = 1507328
vision_app_onchip_bytes = 2883576   # framebuffers live in PSRAM

# Peak activation is the cliff, not the slope. Any external spill costs 5-20x
# (ST measured: DeepLabv3 320->416 = 5.6x, FastDepth 224->320 = 19.5x), so a
# model predicted to spill is reported as such rather than quietly accepted.
activation_warn_frac = 0.85     # of the on-chip pool

[quantize]
# Confirmed against ST's own quantization.html, not folklore:
#   - static only; dynamic/weight-only is explicitly unsupported and silently
#     converted back to float
#   - QDQ format (QOperator is "not tested")
#   - signed int8 for BOTH activations and weights; QUInt8 is "not recommended
#     and not tested" and the NPU rejects it outright
#   - per-channel symmetric weights
format = "QDQ"
activation_type = "QInt8"
weight_type = "QInt8"
per_channel = true
calibrate_method = "MinMax"
# ORT's default is asymmetric activations. Symmetric activations force every
# zero-point to 0, which is what lets a deployment contract read "offset 0" and
# lets a hand-written front end quantise with q = round(x/scale) and no offset
# term. A recipe that depends on that says so in its own [quantize] table.
activation_symmetric = false
weight_symmetric = true
calibration_samples = 128
calibration_seed = 0

# Host int8-vs-fp32 cosine below this is reported, not hidden. It is NOT a
# gate: a model that quantises badly is still a valid zoo entry, and the
# number is the finding.
fidelity_warn_cos = 0.99

# Silent-quantisation-discard detector. BOOL tensors in the emitted *_Q.json
# make atonn drop ALL quantisation with no error, yielding a model that
# compiles, runs, and is secretly float. Compare the compiler's reported
# weight bytes against the expected int8 size; a large overshoot means it
# happened.
quant_discard_ratio = 2.5

[measure]
# Nothing enters the leaderboard without this much evidence. A full reload per
# cycle, not just repeated invokes -- the failure mode being defended against
# is stale firmware silently timing the *previous* model.
min_loads = 3
invokes_per_load = 10
# Flag a row as unstable rather than trusting a tight-looking median. Applied
# to the coefficient of variation ACROSS loads; the within-load spread that
# `validate` prints for free is recorded separately, because ten invokes of one
# possibly-wrong firmware can agree beautifully with each other.
unstable_cv = 0.02
# On-target vs host int8 cosine.
ontarget_warn_cos = 0.98

# The bench canary. Read once before each row, so a board that changed
# mid-session is caught at the row it affected rather than inferred afterwards.
# mnist-12 is the choice because it is the cheapest graph in the zoo to load
# and its calibration is deliberately frozen: any movement in its number is
# about the bench, not about the model.
canary_model = "inference-engine-mnist-12"
# Canary drift beyond this quarantines every result in the bracket.
canary_drift_frac = 0.10

[board]
loader_retries = 3
loader_success_marker = "Start operation achieved successfully"
serial_timeout_s = 120
